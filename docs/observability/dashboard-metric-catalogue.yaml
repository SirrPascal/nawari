- dashboard_uid: nawari-endpoint-fleet
  dashboard_title: "Nawari \u2014 Endpoint Fleet Observability Overview"
  domain: Network Observability
  folder: Nawari / Network Observability
  file_path: docker/grafana/dashboards/network_observability/endpoint_fleet_overview.json
  panels_count: 13
  panels:
  - panel_id: 2
    panel_title: Total Enrolled Endpoints
    panel_type: stat
    description: Measures the total inventory count of enrolled endpoint probe hosts
      discovered in Zabbix. A static inventory count establishes the fleet denominator
      for availability calculations. It does not indicate active data transmission
      or device health; compare against Active Reporting Endpoints to identify dormant
      or decommissioned endpoints.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Endpoint info
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 3
    panel_title: Active Reporting Endpoints
    panel_type: stat
    description: Measures the number of endpoint agents actively transmitting telemetry
      samples to the ingestion gateway within the reporting interval. Healthy fleets
      should show active counts matching enrolled inventory. Values significantly
      lower than total enrolled indicate fleet disconnects, host reboots, or gateway
      communication failures.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Default gateway packet loss
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 4
    panel_title: Degraded Edge Endpoints
    panel_type: stat
    description: Counts endpoints currently firing warning or average severity triggers
      for first-hop gateway latency (>50ms), packet loss (>20%), or degraded Wi-Fi.
      Elevated counts highlight localized physical or edge network access impairment
      before wide-area transit is reached. Note that edge degradation does not automatically
      prove WAN or cloud service failure.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Default gateway packet loss
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 5
    panel_title: Stale Endpoints (>15m SLA)
    panel_type: stat
    description: Counts enrolled endpoints that have failed to submit heartbeat or
      telemetry samples for more than 15 minutes (nodata() = 1). A non-zero count
      signals agent process interruption, machine sleep/shutdown, or persistent network
      partition. Missing telemetry must never be interpreted as healthy zero-loss
      or zero-latency conditions.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: SERVICE_ASSURANCE_SLI
    telemetry_source: Nawari Business Service SLI Engine (13B Standard)
    metric_keys:
    - Zabbix Item Query
    unit: short
    refresh_interval: 60 seconds
    freshness_guarantee: < 60 seconds
    operational_limitations: Strict multi-dimensional availability, performance, and
      quality SLI calculations.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 7
    panel_title: Active Primary Interface Distribution
    panel_type: piechart
    description: Displays the distribution of primary active network interface types
      (Ethernet, Wi-Fi, VPN, Cellular) currently utilized by reporting endpoints.
      Useful for diagnosing interface-specific degradation clusters (e.g. airport
      lounge Wi-Fi saturation vs wired operations centers). Note that multi-homed
      endpoints report only their primary default route egress interface.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Network interface type
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 8
    panel_title: Telemetric Environment Provenance
    panel_type: piechart
    description: Classifies reporting endpoints by their cryptographic execution provenance
      (PHYSICAL_PRODUCTION, CONTAINER_SIMULATION, LAB_MOCK). Ensures operators can
      verify that production metrics originate from authentic physical endpoints rather
      than lab harnesses. Provenance is enforced and stamped server-side by the Nawari
      Ingestion Gateway.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Endpoint environment
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 10
    panel_title: Fleet Default Gateway Latency
    panel_type: timeseries
    description: Measures round-trip time (RTT) between endpoint agents and their
      local default gateways across the fleet. Sustained values above 50 ms indicate
      local subnet congestion, duplex mismatches, or Wi-Fi interference. Low gateway
      latency confirms local edge health but does not guarantee WAN transit or cloud
      application availability.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Default gateway latency
    unit: s
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 11
    panel_title: Fleet Default Gateway Packet Loss
    panel_type: timeseries
    description: Measures ICMP probe packet loss percentage between endpoints and
      their first-hop gateway. Values above 0% indicate physical link errors, wireless
      RF collisions, or local switch buffer exhaustion. Loss at the default gateway
      directly impairs real-time voice and video streams across the access layer.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Default gateway packet loss
    unit: percent
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 13
    panel_title: Voice Gateway (5061/tcp) Reachability
    panel_type: stat
    description: Measures transport socket reachability (L4 TCP 3-way handshake) from
      endpoints to perimeter SBC/voice edge devices on port 5061. Values of 1 indicate
      the transport socket was established; 0 indicates network firewall drops or
      server downtime. Crucially, TCP connect success does not verify SIP registration,
      TLS handshake, or bidirectional audio RTP flow.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - /Service reachable .*/
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 14
    panel_title: DNS Resolution Latency
    panel_type: timeseries
    description: Measures the query resolution time for corporate and external hostnames
      against configured nameservers. Elevated resolution times (>50 ms) or timeouts
      indicate recursive resolver saturation, cache thrashing, or upstream DNS transit
      failures. High DNS resolution latency delays all subsequent web and voice session
      establishments.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - /DNS resolution time .*/
    unit: s
    refresh_interval: 30 seconds
