    panel_type: stat
    description: Indicates the execution environment trust tier (PHYSICAL_PRODUCTION,
      CONTAINER_SIMULATION, LAB_MOCK) stamped by the Nawari Gateway. Guarantees that
      diagnostic metrics reflect actual physical device hardware rather than lab test
      runners. Prevents accidental classification of simulated test workloads as enterprise
      field issues.
    datasource_type: alexanderzobnin-zabbix-datasource
