    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 3
    panel_title: Active Interface
    panel_type: stat
    description: Identifies the physical or logical network adapter carrying the endpoint's
      default route (e.g. Ethernet, Wi-Fi, VPN). Determines whether wireless diagnostic
      panels (RSSI, link quality) are active or safely suppressed as N/A. Changing
      interface types during an active session can cause transient latency spikes
      or TCP resets.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
