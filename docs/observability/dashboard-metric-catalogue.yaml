  - panel_id: 6
    panel_title: Default Gateway RTT Latency
    panel_type: timeseries
    description: Measures the ICMP round-trip time between this endpoint and its first-hop
      default gateway. Values below 10 ms indicate healthy local Ethernet or enterprise
      Wi-Fi; values above 50 ms signal local access-layer congestion. Gateway latency
      reflects only the access link and does not measure wide-area network or cloud
      transit.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
