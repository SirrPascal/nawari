    panel_type: gauge
    description: Measures Received Signal Strength Indicator (RSSI) in dBm for wireless
      connections. Values closer to zero indicate stronger signal (-50 dBm is excellent,
      below -75 dBm indicates poor coverage). Automatically displays N/A for wired
