  dashboard_title: "Nawari \u2014 Network Path & Directional Hop Analysis"
  domain: Network Observability
  file_path: docker/grafana/dashboards/network_observability/network_path_analysis.json
  panel_count: 8
  metrics:
  - panel_id: 2
    panel_title: End-to-End Latency
    panel_description: Measures the total round-trip time between the endpoint and the destination target along the discovered
      path. Sudden increases in end-to-end latency indicate routing shifts, congested transit links, or bufferbloat. Note
      that traceroute RTT may differ slightly from TCP application latency due to different network priority queues. Missing
      data indicates collector outage, agent failure, or network disruption; values are preserved as null gaps.
    metric_name: End-to-End Latency
    zabbix_item_key: End-to-End Latency
    source_device: mon-grafana01
    source_ip: 10.1.x.x
    collection_mechanism: SNMP / ICMP
    exact_identifier: Directional Traceroute Hop Analysis (`services/network/path_analyzer.py`)
    supported_product_release: Cisco IOS-XE / Arista EOS / Linux Network Fleet
    value_type: FLOAT
    units: s
    collection_interval: 60s
    expected_data_freshness: < 60s
    preprocessing_and_calculation: Hop-by-hop RTT, packet loss, and bufferbloat detection.
    data_nature: REAL
    supporting_evidence: Phase 7C Network Path Analysis Specification
    validation_status: VERIFIED_INTEGRATION
  - panel_id: 3
    panel_title: End-to-End Packet Loss
    panel_description: Percentage of probe packets lost between the endpoint and the final destination target. Values above
      0% indicate severe path impairment that causes TCP retransmissions and degraded voice/video quality. Must be evaluated
      alongside intermediate hop loss; loss at the target is true circuit loss, whereas intermediate non-responses may be
      CoPP. Missing data indicates collector outage, agent failure, or network disruption; values are preserved as null gaps.
    metric_name: End-to-End Packet Loss
    zabbix_item_key: End-to-End Packet Loss
    source_device: mon-grafana01
    source_ip: 10.1.x.x
    collection_mechanism: SNMP / ICMP
