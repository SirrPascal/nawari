    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 12
    panel_title: Wi-Fi Link Quality History
    panel_type: timeseries
    description: Tracks changes in wireless link stability over time, revealing intermittent
      RF interference or access point congestion. Correlate dips in link quality with
      default gateway loss and voice jitter to isolate wireless edge faults. Only
      active for Wi-Fi interfaces; remains N/A for wired or cellular connections.
      Missing data indicates collector outage, agent failure, or network disruption;
