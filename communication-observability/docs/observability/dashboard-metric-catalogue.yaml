    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 6
    panel_title: Default Gateway RTT Latency
    panel_type: timeseries
    description: Measures the ICMP round-trip time between this endpoint and its first-hop
      default gateway. Values below 10 ms indicate healthy local Ethernet or enterprise
      Wi-Fi; values above 50 ms signal local access-layer congestion. Gateway latency
      reflects only the access link and does not measure wide-area network or cloud
      transit. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Default gateway latency
    unit: s
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 7
    panel_title: Default Gateway Packet Loss
    panel_type: timeseries
    description: Measures the percentage of dropped ICMP echo requests sent to the
      local default gateway. Any sustained packet loss (>1%) degrades TCP throughput
      and causes audio dropouts on real-time voice calls. Loss at the first hop indicates
      faulty cabling, Wi-Fi channel contention, or local switch port congestion. Missing
      data indicates collector outage, agent failure, or network disruption; values
      are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Default gateway packet loss
    unit: percent
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 9
    panel_title: Wi-Fi RSSI Gauge
    panel_type: gauge
    description: Measures Received Signal Strength Indicator (RSSI) in dBm for wireless
      connections. Values closer to zero indicate stronger signal (-50 dBm is excellent,
      below -75 dBm indicates poor coverage). Automatically displays N/A for wired
      Ethernet or VPN connections to prevent misleading zero readings. Missing data
      indicates collector outage, agent failure, or network disruption; values are
      preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
