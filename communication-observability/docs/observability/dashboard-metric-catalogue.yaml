  panels_count: 17
  panels:
  - panel_id: 2
    panel_title: Agent Info & Host Identity
    panel_type: stat
    description: Displays the agent version, hostname, and operating system build
      of the selected endpoint. Confirms that the endpoint agent daemon is running
      the current approved software build. Note that hostname strings are reported
      by the local OS and are validated against the persistent agent UUID. Missing
      data indicates collector outage, agent failure, or network disruption; values
      are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Endpoint info
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 3
    panel_title: Active Interface
    panel_type: stat
    description: Identifies the physical or logical network adapter carrying the endpoint's
      default route (e.g. Ethernet, Wi-Fi, VPN). Determines whether wireless diagnostic
      panels (RSSI, link quality) are active or safely suppressed as N/A. Changing
      interface types during an active session can cause transient latency spikes
      or TCP resets. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
