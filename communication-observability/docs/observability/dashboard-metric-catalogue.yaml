    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 15
    panel_title: Corporate HTTP Services TTFB
    panel_type: timeseries
    description: Measures HTTP Time To First Byte (TTFB) from request transmission
      to initial response byte across monitored corporate web endpoints. Elevated
      TTFB indicates server-side application processing delays, backend database bottlenecks,
      or reverse proxy queuing. TTFB measures server processing latency, distinct
      from TCP connect and TLS negotiation times. Missing data indicates collector
