  - panel_id: 17
    panel_title: Service Target Reachability
    panel_type: stat
    description: Reports whether TCP/TLS connections to monitored service targets
      succeeded (1=REACHABLE, 0=DOWN). A value of 0 indicates that the TCP handshake
      failed, was refused, or timed out. Transport reachability confirms socket connectivity
      across firewalls but does not verify application functionality or user authentication.
      Missing data indicates collector outage, agent failure, or network disruption;
      values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
