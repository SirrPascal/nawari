- dashboard_uid: nawari-path-analysis
  dashboard_title: "Nawari \u2014 Network Path & Directional Hop Analysis"
  domain: Network Observability
  folder: Nawari / Network Observability
  file_path: docker/grafana/dashboards/network_observability/network_path_analysis.json
  panels_count: 8
  panels:
  - panel_id: 2
    panel_title: End-to-End Latency
    panel_type: stat
    description: Measures the total round-trip time between the endpoint and the destination
      target along the discovered path. Sudden increases in end-to-end latency indicate
      routing shifts, congested transit links, or bufferbloat. Note that traceroute
      RTT may differ slightly from TCP application latency due to different network
      priority queues. Missing data indicates collector outage, agent failure, or
      network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Path end-to-end latency [$target]
    unit: s
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 3
    panel_title: End-to-End Packet Loss
    panel_type: stat
    description: Percentage of probe packets lost between the endpoint and the final
      destination target. Values above 0% indicate severe path impairment that causes
      TCP retransmissions and degraded voice/video quality. Must be evaluated alongside
      intermediate hop loss; loss at the target is true circuit loss, whereas intermediate
      non-responses may be CoPP. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Path end-to-end packet loss [$target]
    unit: percent
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 4
    panel_title: Total Path Hops
    panel_type: stat
    description: The number of layer-3 routing hops traversed between the endpoint
      and the destination target. Significant changes in hop count indicate dynamic
      route re-convergence, BGP shifts, or failover to backup circuits. Path length
      alone does not determine latency, but abrupt hop count increases often correlate
      with path suboptimality. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Path total hops [$target]
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 5
    panel_title: Path Route Stability
    panel_type: stat
    description: Indicates whether the network forwarding path has remained stable
      or diverged from its baseline hash signature (0=STABLE, 1=ROUTE CHANGED). Frequent
      route changes signal flapping links, asymmetric routing, or ECMP churn. Route
      flapping introduces transient packet reordering and jitter that degrade real-time
      traffic. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Path route changed [$target]
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 7
    panel_title: CoPP Guard Architectural Interpretation
    panel_type: text
    description: Technical notice explaining Control Plane Policing (CoPP) mechanics
      in modern router backbones. Transit data packets are prioritized in hardware
      ASICs, while ICMP Time Exceeded packets are rate-limited by router CPUs. Hops
      showing packet loss or timeouts must not be classified as network failures if
      downstream hops and destinations are responsive. Missing data indicates collector
      outage, agent failure, or network disruption; values are preserved as null gaps.
    datasource_type: zabbix
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Zabbix Item Query
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 9
    panel_title: Discovered Hop Details (IP, RTT, Packet Loss, CoPP Status)
    panel_type: table
    description: Detailed hop-by-hop breakdown showing router IP addresses, reverse
      DNS hostnames, autonomous system numbers (ASN), average RTT, packet loss, and
      CoPP status. Identifies exactly which network transit hop introduces latency
      or packet loss. Non-responsive hops marked COPP_RATE_LIMITED indicate benign
      control plane filtering rather than link failure. Missing data indicates collector
      outage, agent failure, or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - /nawari.path.hop..*[$target,.*/
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 11
    panel_title: Hop Latency Progression Waterfall (Detecting >40ms Latency Jumps)
    panel_type: timeseries
    description: Visualizes cumulative round-trip latency as packets traverse each
      successive hop toward the target. Sharp increases (>40 ms) between consecutive
      hops isolate congested physical spans, submarine cable transitions, or satellite
      links. Helps distinguish whether latency originates in the local LAN, enterprise
      WAN, or third-party ISP transit. Missing data indicates collector outage, agent
      failure, or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - /nawari.path.hop.rtt[$target,.*/
    unit: s
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 13
    panel_title: Route Divergence History (Path Signature Hash Transitions)
    panel_type: timeseries
    description: Tracks changes in the SHA-256 path signature over time, showing when
      routing topology shifted. Spikes to 1 indicate an detected change in IP hop
      sequence, transit ASNs, or interface path. Correlate path change events with
      latency jumps or voice quality drops to determine whether ISP routing updates
      caused service degradation. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Path route changed [$target]
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
