    panel_type: timeseries
    description: Calculates voice quality drift velocity (dMOS/dt). Projects forward
      MOS at 15-minute and 30-minute horizons. Negative slopes steeper than -0.15
      MOS/10min trigger early degradation pre-alarms. Missing data indicates collector
      outage, agent failure, or network disruption; values are preserved as null gaps.
