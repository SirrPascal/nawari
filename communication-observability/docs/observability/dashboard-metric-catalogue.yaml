    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 10
    panel_title: Wi-Fi RSSI History
    panel_type: timeseries
    description: Displays signal strength trends over time to identify roaming events,
      physical shielding, or intermittent RF fading. Rapid drops in RSSI typically
      coincide with user movement or environmental RF interference. Persistently weak
      signal forces the Wi-Fi adapter to fall back to lower modulation schemes, increasing
      latency. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
