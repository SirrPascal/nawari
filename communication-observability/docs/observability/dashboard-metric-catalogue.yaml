  - panel_id: 20
    panel_title: HTTP Time To First Byte (TTFB)
    panel_type: timeseries
    description: 'Time To First Byte: duration from HTTP request transmission until
      the first response byte arrives. Measures upstream application processing latency,
      distinct from TCP and TLS setup times. High TTFB with low TCP/TLS times isolates
      application server or database performance issues. Missing data indicates collector
