  - panel_id: 18
    panel_title: TCP 3-Way Handshake Latency
    panel_type: timeseries
    description: Duration of the L4 TCP 3-way handshake (SYN to ACK). Represents pure
      transport-layer round-trip time, independent of subsequent TLS negotiation.
      Elevated values indicate network transit latency or server SYN backlog exhaustion.
      Missing data indicates collector outage, agent failure, or network disruption;
      values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
