  - panel_id: 14
    panel_title: DNS Query Resolution Time by Target
    panel_type: timeseries
    description: Measures the time required to resolve configured domain names using
      the endpoint's configured DNS servers. Values above 50 ms indicate DNS server
      overload or network delays between the endpoint and the resolver. This measurement
      reflects only name resolution, not subsequent TCP connection or HTTP response
      times. Missing data indicates collector outage, agent failure, or network disruption;
      values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - /DNS resolution time .*/
    unit: s
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 15
    panel_title: DNS Target RCODE / Status
    panel_type: stat
    description: Displays the DNS response code returned by the resolver (NOERROR=0,
      NXDOMAIN=3, SERVFAIL=2, TIMEOUT=4). Non-zero RCODEs indicate DNS configuration
      errors, missing records, or resolver upstream lookup failures. An endpoint cannot
      establish network sessions if DNS resolution fails, even if underlying IP transport
      is healthy. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
