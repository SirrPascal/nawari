    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 14
    panel_title: DNS Resolution Latency
    panel_type: timeseries
    description: Measures the query resolution time for corporate and external hostnames
      against configured nameservers. Elevated resolution times (>50 ms) or timeouts
      indicate recursive resolver saturation, cache thrashing, or upstream DNS transit
      failures. High DNS resolution latency delays all subsequent web and voice session
      establishments. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
