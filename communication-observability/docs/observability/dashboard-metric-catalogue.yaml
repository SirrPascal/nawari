- dashboard_uid: nawari-voice-correlation
  dashboard_title: "Nawari \u2014 Cross-Domain Voice & Endpoint Telemetry Correlation"
  domain: Communication Observability
  folder: Nawari / Communication Observability
  file_path: docker/grafana/dashboards/communication_observability/endpoint_voice_correlation.json
  panels_count: 9
  panels:
  - panel_id: 2
    panel_title: Voice Observability Domain Boundary
    panel_type: text
    description: Architectural guidelines defining the separation between network
      transport and voice application health. A successful TCP/TLS handshake to SBC
      port 5061 proves only layer-4 socket reachability. It does not verify SIP registration,
      digest authentication, codec negotiation, or bidirectional media flow. Missing
      data indicates collector outage, agent failure, or network disruption; values
      are preserved as null gaps.
    datasource_type: zabbix
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Zabbix Item Query
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 4
    panel_title: Voice Call Outcome
    panel_type: stat
    description: Reports the signaling and media result of controlled Asterisk synthetic
      voice probes (ANSWERED, BUSY, CONGESTION, TIMEOUT, FAILED). A healthy result
      confirms end-to-end SIP signaling and call setup across the voice core. CONGESTION
      (SIP 503) or TIMEOUT (SIP 408) indicates trunk capacity exhaustion or core server
      unreachability. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: SYNTHETIC_PROBE
    telemetry_source: Synthetic Asterisk Call Engine (AMI / RTCP Telemetry)
    metric_keys:
    - Synthetic call outcome
    unit: short
    refresh_interval: "30s\u201360s"
    freshness_guarantee: < 60 seconds (Probe Cycle Interval)
    operational_limitations: Reflects synthetic test calls generated between local
      probes and test extensions. Does not represent actual customer or airline agent
      voice conversations.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 5
    panel_title: Estimated MOS Score
    panel_type: stat
    description: Calculates Mean Opinion Score (1.0 to 4.5) using ITU-T G.107 E-model
      based on measured RTP packet loss, jitter, and delay. Scores below 3.8 indicate
      noticeable degradation; scores below 3.5 indicate unacceptable voice quality.
      Crucially, displays UNKNOWN when RTCP reports are missing to avoid fabricating
      voice quality metrics. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: SYNTHETIC_PROBE
    telemetry_source: Synthetic Asterisk Call Engine (AMI / RTCP Telemetry)
    metric_keys:
    - Synthetic call Estimated MOS
    unit: short
    refresh_interval: "30s\u201360s"
    freshness_guarantee: < 60 seconds (Probe Cycle Interval)
    operational_limitations: Reflects synthetic test calls generated between local
      probes and test extensions. Does not represent actual customer or airline agent
      voice conversations.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 6
    panel_title: SBCE Port 5061 L4 Transport Socket
    panel_type: stat
    description: Perimeter L4 TCP/TLS socket connectivity only. Does NOT indicate
      SIP registration, authentication, or media flow. Verifies that the Avaya SBCE
      perimeter listener accepts TCP connections from the endpoint network. Socket
      connectivity is a prerequisite for voice service, but cannot prove telephony
      or media functionality. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_SBCE_SNMP
    telemetry_source: Avaya SBCE 8.1 SNMPv3 Agent (IF-MIB / HOST-RESOURCES-MIB / UCD-SNMP-MIB)
    metric_keys:
    - /Service reachable .*/
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Reflects physical/virtual appliance operating metrics
      and carrier interface traffic. Verifies transport/session plane capacity.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 7
    panel_title: Endpoint Gateway Loss
    panel_type: stat
    description: Percentage of probe packets lost to the endpoint's local default
      gateway. Evaluates whether the user's local network access link is impaired
      during voice calls. Packet loss on the first-hop access link severely impacts
      RTP voice streams regardless of WAN or SBC health. Missing data indicates collector
      outage, agent failure, or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Default gateway packet loss
    unit: percent
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 9
    panel_title: 'Dual-Axis Correlation: Gateway Edge Latency vs Voice MOS'
    panel_type: timeseries
    description: Gateway edge latency and voice MOS operate on distinct operational
      layers. Visual correlation on dual axes does not imply direct causation; voice
      impairment may stem from core network or upstream carrier conditions, while
      high gateway latency may affect local transit without degrading an established
      prioritized RTP session. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: SYNTHETIC_PROBE
    telemetry_source: Synthetic Asterisk Call Engine (AMI / RTCP Telemetry)
    metric_keys:
    - Default gateway latency
    - Synthetic call Estimated MOS
    unit: s
    refresh_interval: "30s\u201360s"
    freshness_guarantee: < 60 seconds (Probe Cycle Interval)
    operational_limitations: Reflects synthetic test calls generated between local
      probes and test extensions. Does not represent actual customer or airline agent
      voice conversations.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 11
    panel_title: 'Cross-Domain Packet Loss: Edge vs Path vs Voice Audio Stream'
    panel_type: timeseries
    description: Multi-layer loss comparison overlaying default gateway loss, end-to-end
      network path loss, and voice audio stream packet loss. If gateway loss matches
      voice loss, the root cause is local to the access network. If voice loss occurs
      while edge and path loss are zero, the issue lies in upstream SIP trunks, transcoding
      DSPs, or carrier routing. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: SYNTHETIC_PROBE
    telemetry_source: Synthetic Asterisk Call Engine (AMI / RTCP Telemetry)
    metric_keys:
    - Default gateway packet loss
    - /Path end-to-end packet loss .*/
    - Synthetic call RTP packet loss
    unit: percent
    refresh_interval: "30s\u201360s"
    freshness_guarantee: < 60 seconds (Probe Cycle Interval)
    operational_limitations: Reflects synthetic test calls generated between local
      probes and test extensions. Does not represent actual customer or airline agent
      voice conversations.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 13
    panel_title: Wi-Fi Quality vs Audio RTCP Jitter
    panel_type: timeseries
    description: Correlates local physical Wi-Fi signal quality with voice call RTP
      jitter (derived from RTCP Receiver Reports). Local Wi-Fi channel contention
      or low signal directly inflates media packet jitter. Helps operators determine
      whether voice choppy audio complaints originate from local office Wi-Fi or the
