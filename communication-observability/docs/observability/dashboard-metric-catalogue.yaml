    \ Health"
  domain: Communication Observability
  folder: Nawari / Communication Observability
  file_path: docker/grafana/dashboards/communication_observability/recording_wfo_operational_health.json
  panels_count: 10
  panels:
  - panel_id: 2
    panel_title: WFO Product Specification Status [PENDING VENDOR CONFIRMATION]
    panel_type: stat
    description: 'Product specification and boundary requirements: WFO is an enterprise
      product category, not a specific product. Displays integration prerequisites
      (Verint / NICE / Geomant / AWOS verification required). Documents that Nawari
      collects operational metadata ONLY; voice audio recordings are strictly excluded.
      Missing data indicates collector outage, agent failure, or network disruption;
      values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - wfoProductSpecificationStatus
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 3
    panel_title: "Recorder-to-CM CTI Link State [APPLICATION \u2014 WFO]"
    panel_type: stat
    description: 'Operational health of the CTI signaling link between Avaya Communication
      Manager and the recording server cluster (TSAPI / DMCC / CSTA). 1 = Link Active,
      0 = Link Down. Critical alert if down: halts call metadata association. Source:
      CTI daemon check. Polling: 60s. Missing data indicates collector outage, agent
      failure, or network disruption; values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Compliance Voice Recording Pipeline Health
    unit: short
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 4
    panel_title: "Recording Host Uptime [REAL \u2014 HARDWARE]"
    panel_type: stat
    description: 'Operating system uptime of the recording application host server.
      Source: MIB-II sysUpTime. Polling: 60s. Missing data indicates collector outage,
      agent failure, or network disruption; values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Recording Host Uptime
    unit: s
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 6
    panel_title: "Active Recording Sessions [APPLICATION \u2014 WFO]"
    panel_type: stat
    description: 'Live count of concurrent telephone voice conversations currently
      being actively captured and recorded. Source: Recording daemon active session
      counter. Polling: 60s. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Compliance Voice Recording Pipeline Health
    unit: calls
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 7
    panel_title: "Ingestion Rate (Calls/min) [APPLICATION \u2014 WFO]"
    panel_type: timeseries
    description: 'Rate of recorded call metadata payloads ingested and indexed into
      the archive per minute. Source: WFO ingestion API. Polling: 60s. Missing data
      indicates collector outage, agent failure, or network disruption; values are
      preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Recording Ingestion Rate
    unit: cpm
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 8
    panel_title: "Recording Failures Count [APPLICATION \u2014 WFO]"
    panel_type: stat
    description: 'Count of failed recording operations (e.g. RTP stream missing, CTI
      timeout, codec mismatch) in the preceding hour. Source: Recording error log.
      Warning: > 0 failures. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Compliance Voice Recording Pipeline Health
    unit: calls
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 9
    panel_title: "Ingestion Queue Depth [APPLICATION \u2014 WFO]"
    panel_type: gauge
    description: 'Number of call recording files currently buffered in local staging
      storage awaiting transfer to long-term archive. Warning: > 200 calls. Critical:
      > 500 calls. Source: Ingestion queue monitor. Missing data indicates collector
      outage, agent failure, or network disruption; values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Ingestion Buffer Queue Depth
    unit: calls
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 11
    panel_title: "Recording Storage Utilization (%) [REAL \u2014 HARDWARE]"
    panel_type: gauge
    description: 'Storage capacity utilization percentage across dedicated call recording
      storage volumes. Warning: > 80%, Critical: > 90%. Source: HOST-RESOURCES-MIB
      hrStorageUsed. Polling: 5m. Missing data indicates collector outage, agent failure,
      or network disruption; values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Compliance Voice Recording Spool Free Storage
    unit: percent
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 12
    panel_title: Projected Days-to-Full (Storage TTE) [PREDICTIVE]
    panel_type: stat
    description: 'Projected remaining days before recording storage volume reaches
      90% and 100% capacity saturation based on rolling 14-day daily ingestion trajectory.
      Source: Nawari Storage Capacity Forecaster. Warning: < 30 days. Missing data
      indicates collector outage, agent failure, or network disruption; values are
      preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Projected Days-to-Full (Storage TTE)
    unit: d
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 13
    panel_title: "Daily Archival Success Rate (%) [APPLICATION \u2014 WFO]"
    panel_type: gauge
    description: 'Percentage of completed daily call recordings successfully migrated
      and verified in the offsite long-term immutable archival tier. Target: 100%.
      Source: WFO Archival Verifier. Missing data indicates collector outage, agent
      failure, or network disruption; values are preserved as null gaps.'
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
    telemetry_source: Zabbix Telemetry Engine (SNMPv2c/v3, ICMP ping, Zabbix Agent
      LLD)
    metric_keys:
    - Daily Archival Transfer Success Rate
    unit: percent
    refresh_interval: 30 seconds
    freshness_guarantee: < 30 seconds
    operational_limitations: Direct physical switch, router, and host metrics.
    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
total_dashboards: 24
total_visualization_panels: 200
