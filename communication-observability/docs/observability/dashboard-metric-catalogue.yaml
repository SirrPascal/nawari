    null_handling: 'spanNulls: False (nulls preserved as gaps, never coerced to 0)'
  - panel_id: 11
    panel_title: Wi-Fi Link Quality Gauge
    panel_type: gauge
    description: Normalized wireless link quality score from 0% to 100%, incorporating
      signal-to-noise ratio and packet retry rates. Scores above 70% support reliable
      voice communications; scores below 40% lead to severe packet jitter and audio
      clipping. Displays N/A on wired interfaces to enforce strict physical telemetry
      isolation. Missing data indicates collector outage, agent failure, or network
      disruption; values are preserved as null gaps.
    datasource_type: alexanderzobnin-zabbix-datasource
    provenance_type: REAL_ZABBIX_TELEMETRY
