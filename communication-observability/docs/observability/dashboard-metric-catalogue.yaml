    panel_title: Dynamic Baseline Bands vs Real-Time Metric Telemetry
    panel_type: timeseries
    description: "Compares observed metric values against dynamic historical diurnal\
      \ baseline bands ([\u03BC - 2.5\u03C3, \u03BC + 2.5\u03C3]) computed per hour\
      \ and day-of-week. Excursions outside the shaded corridor trigger statistical\
      \ anomaly evaluations. Missing data indicates collector outage, agent failure,\
      \ or network disruption; values are preserved as null gaps."
    datasource_type: alexanderzobnin-zabbix-datasource
