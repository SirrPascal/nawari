apiVersion: 1

datasources:
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zabbix-web:8080/api_jsonrpc.php
    jsonData:
      authType: token
      trends: true
      trendsFrom: 7d
      trendsRange: 4d
    secureJsonData:
      apiToken: ${ZBX_API_TOKEN}
    version: 4
    isDefault: true
    editable: true
