[general]
static = yes
writeprotect = no
clearglobalvars = no

; Local loopback and diagnostic playback context for lab & synthetic test verification
[nawari-diagnostic]
; Extension 1001: Echo test (reflects RTP audio back to caller for jitter/loss measurement)
exten => 1001,1,NoOp(Nawari Synthetic Echo Test - Ext 1001)
 same => n,Set(TIMEOUT(absolute)=3)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()


; Extension 1002: Fast Answer & Disconnect (for setup latency testing)
exten => 1002,1,NoOp(Nawari Fast Answer & Hangup - Ext 1002)
 same => n,Answer()
 same => n,Wait(3)
 same => n,Hangup()

; Extension 1003: Busy simulator
exten => 1003,1,NoOp(Nawari Busy Test - Ext 1003)
 same => n,Busy(1)
 same => n,Hangup(17)

; Extension 1004: Congestion simulator
exten => 1004,1,NoOp(Nawari Congestion Test - Ext 1004)
 same => n,Congestion(1)
 same => n,Hangup(34)


; Outbound dialing context towards Avaya SBCE / Session Manager
[nawari-outbound]
exten => _X.,1,NoOp(Nawari Outbound Synthetic Call: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@avaya-sbce-trunk,20,b(nawari-correlation^s^1(${NAWARI_ACTION_ID})))
 same => n,Hangup()

; Correlation handler: Injects explicit unique X-Nawari-ActionID header into outbound INVITE
[nawari-correlation]
exten => s,1,Set(PJSIP_HEADER(add,X-Nawari-ActionID)=${ARG1})
 same => n,Return()

