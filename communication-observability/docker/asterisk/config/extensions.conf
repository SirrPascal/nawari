[general]
static = yes
writeprotect = no
clearglobalvars = no

; Local loopback and diagnostic playback context for lab & synthetic test verification
[nawari-diagnostic]
; Extension 1001: Echo test (reflects RTP audio back to caller for jitter/loss measurement)
exten => 1001,1,NoOp(Nawari Synthetic Echo Test - Ext 1001)
 same => n,Set(TIMEOUT(absolute)=3)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()


; Extension 1002: Fast Answer & Disconnect (for setup latency testing)
exten => 1002,1,NoOp(Nawari Fast Answer & Hangup - Ext 1002)
 same => n,Answer()
 same => n,Wait(3)
 same => n,Hangup()

; Extension 1003: Busy simulator
exten => 1003,1,NoOp(Nawari Busy Test - Ext 1003)
 same => n,Busy(1)
 same => n,Hangup(17)

; Extension 1004: Congestion simulator
exten => 1004,1,NoOp(Nawari Congestion Test - Ext 1004)
 same => n,Congestion(1)
 same => n,Hangup(34)


; Outbound dialing context towards Avaya SBCE / Session Manager
; Strictly gated by pre-call safety checks and Stage 1 OPTIONS verification
; WILD-CARD RANGES (e.g. _88XX) ARE STRICTLY PROHIBITED TO PREVENT ROUTING TO UNAPPROVED NUMBERS
[nawari-outbound]
; Stage 2 Authorized Internal Test Endpoints (Subject to Voice Operations approval)
exten => 8801,1,NoOp(Nawari Stage 2 Controlled Internal Echo Test: 8801)
 same => n,Set(NAWARI_TEST_STAGE=STAGE_2_INTERNAL_ECHO)
 same => n,Dial(PJSIP/8801@avaya-sbce-primary,15,b(nawari-correlation^s^1(${NAWARI_ACTION_ID},STAGE_2_INTERNAL_ECHO)))
 same => n,Hangup()

exten => 8802,1,NoOp(Nawari Stage 2 Controlled Internal Fast Answer Test: 8802)
 same => n,Set(NAWARI_TEST_STAGE=STAGE_2_INTERNAL_FAST_ANSWER)
 same => n,Dial(PJSIP/8802@avaya-sbce-primary,15,b(nawari-correlation^s^1(${NAWARI_ACTION_ID},STAGE_2_INTERNAL_FAST_ANSWER)))
 same => n,Hangup()

; All unmapped destinations are immediately rejected
exten => _X.,1,NoOp(Nawari Outbound Blocked: Destination ${EXTEN} not explicitly authorized)
 same => n,Playback(ss-noservice)
 same => n,Hangup(21)

; Correlation handler: Injects explicit unique X-Nawari-ActionID and telemetry headers into outbound INVITE
[nawari-correlation]
exten => s,1,Set(PJSIP_HEADER(add,X-Nawari-ActionID)=${ARG1})
 same => n,Set(PJSIP_HEADER(add,X-Nawari-Origin)=AVTEST_ASTERISK)
 same => n,Set(PJSIP_HEADER(add,X-Nawari-Test-Stage)=${ARG2})
 same => n,Return()


