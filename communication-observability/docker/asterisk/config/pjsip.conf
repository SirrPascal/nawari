; NAWARI PJSIP Configuration
; Voice Observability and Synthetic Testing

[global]
type = global
debug = no

; Transports
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
verify_server = no
verify_client = no

; ---------------------------------------------------------
; Diagnostic Loopback Endpoints for Isolated Local Testing
; ---------------------------------------------------------

; Diagnostic caller endpoint used by synthetic call originator
[diagnostic-caller]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no

; Local loopback destination endpoints
[1001]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1001

[1001]
type = aor
max_contacts = 1

[1002]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1002

[1002]
type = aor
max_contacts = 1

[1003]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1003

[1003]
type = aor
max_contacts = 1

[1004]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1004

[1004]
type = aor
max_contacts = 1

; ---------------------------------------------------------
; Avaya SBCE / Session Manager Outbound Trunk (Gated Profile)
; ---------------------------------------------------------
[avaya-sbce-trunk]
type = endpoint
transport = transport-udp
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = avaya-sbce-trunk

[avaya-sbce-trunk]
type = aor
contact = sip:10.2.156.131:5060
qualify_frequency = 60

