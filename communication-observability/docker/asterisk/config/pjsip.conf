; NAWARI PJSIP Configuration
; Voice Observability and Synthetic Testing

[global]
type = global
debug = no

; Transports
[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tls]
type = transport
protocol = tls
bind = 0.0.0.0:5061
method = tlsv1_2
verify_server = no
verify_client = no

; ---------------------------------------------------------
; Diagnostic Loopback Endpoints for Isolated Local Testing
; ---------------------------------------------------------

; Diagnostic caller endpoint used by synthetic call originator
[diagnostic-caller]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no

[diagnostic-caller-identify]
type = identify
endpoint = diagnostic-caller
match = 127.0.0.1

; Local loopback destination endpoints
[1001]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1001

[1001]
type = aor
max_contacts = 1

[1002]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1002

[1002]
type = aor
max_contacts = 1

[1003]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1003

[1003]
type = aor
max_contacts = 1

[1004]
type = endpoint
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = 1004

[1004]
type = aor
max_contacts = 1

; ---------------------------------------------------------
; Avaya SBCE / Session Manager Outbound Trunks & Probes
; ---------------------------------------------------------

; Legacy loopback profile (backward compatibility for local tests)
[avaya-sbce-trunk]
type = endpoint
transport = transport-udp
context = nawari-diagnostic
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = avaya-sbce-trunk

[avaya-sbce-trunk]
type = aor
contact = sip:127.0.0.1:5060
qualify_frequency = 0

; ---------------------------------------------------------
; Stage 1 & Stage 2 Live Avaya Infrastructure Endpoints
; (Requires Voice Operations authorization & network access)
; ---------------------------------------------------------

; Avaya SBCE Primary Signaling Interface (B1 / Internal or A1 / DMZ)
[avaya-sbce-primary]
type = endpoint
transport = transport-udp
context = nawari-outbound
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = avaya-sbce-primary

[avaya-sbce-primary]
type = aor
contact = sip:10.2.156.131:5060
qualify_frequency = 60
qualify_timeout = 3.0

; Avaya SBCE Secondary Signaling Interface (HA Standby)
[avaya-sbce-secondary]
type = endpoint
transport = transport-udp
context = nawari-outbound
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = avaya-sbce-secondary

[avaya-sbce-secondary]
type = aor
contact = sip:10.2.156.130:5060
qualify_frequency = 60
qualify_timeout = 3.0

; Avaya Session Manager Core SIP Signaling Entity
[avaya-sm-primary]
type = endpoint
transport = transport-udp
context = nawari-outbound
disallow = all
allow = ulaw
allow = alaw
dtmf_mode = rfc4733
direct_media = no
aors = avaya-sm-primary

[avaya-sm-primary]
type = aor
contact = sip:10.2.156.40:5060
qualify_frequency = 60
qualify_timeout = 3.0


