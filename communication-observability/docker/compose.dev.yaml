# ==============================================================================
# NAWARI — Local Development Docker Compose Overrides (Phase 1)
# Target: macOS (Apple Silicon ARM64 / Docker Desktop)
# ==============================================================================

services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  zabbix-snmptraps:
    ports:
      - "${SNMP_TRAP_BIND_IP:-127.0.0.1}:${SNMP_TRAP_PORT:-162}:1162/udp"

  zabbix-server:
    ports:
      - "${ZBX_SERVER_BIND_IP:-0.0.0.0}:${ZBX_SERVER_PORT:-10051}:10051"

  zabbix-web:
    ports:
      - "${ZBX_WEB_BIND_IP:-127.0.0.1}:${ZBX_WEB_PORT:-8088}:8080"

  grafana:
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"

  mock-snmp:
    build:
      context: ./mock-snmp
      dockerfile: Dockerfile
    image: nawari-mock-snmp:latest
    container_name: nawari-mock-snmp
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    networks:
      - nawari-internal
    ports:
      - "127.0.0.1:1161:161/udp"

  asterisk:
    profiles:
      - synthetic-voice
    ports:
      - "127.0.0.1:${ASTERISK_AMI_PORT:-5038}:5038"
      - "127.0.0.1:${ASTERISK_SIP_PORT:-5060}:5060/udp"
      - "127.0.0.1:${ASTERISK_TLS_PORT:-5061}:5061"

