# provisioning/endpoint/zabbix_agent2_eunem.conf
# Zabbix Agent 2 Active Checks Configuration for Nawari EU-NEM Pilot
# Applicable for Windows 10/11 and macOS Darwin endpoints.

# --- Core Active Checks Settings ---
# Outbound communication to Zabbix Server or Proxy over TCP 10051
ServerActive=127.0.0.1:10051
Hostname=KQ-LT-WIN-01

# Active check scheduling and buffer flush intervals
RefreshActiveChecks=60
BufferSend=5
BufferSize=2000

# --- Persistent Offline Buffering ---
# Protects telemetry during Wi-Fi drops, sleep, transit, and VPN reconnections
EnablePersistentBuffer=1
PersistentBufferPeriod=24h

# File path for SQLite persistent buffer
# On Windows: C:\Program Files\Zabbix Agent 2\buffer.db
# On macOS:   /var/lib/zabbix/buffer.db
# PersistentBufferFile=/var/lib/zabbix/buffer.db

# --- Security & Resource Governance ---
# Deny unrestricted system commands; use only allowlisted UserParameters
AllowKey=system.run[*]
AllowKey=net.*
AllowKey=vfs.*
AllowKey=vm.*
AllowKey=eventlog[*]
AllowKey=nawari.*

# --- UserParameters for End-User Network Experience Monitoring ---
# Windows UserParameters (PowerShell):
# UserParameter=nawari.nem.gateway,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\nawari_nem_probe.ps1" gateway
# UserParameter=nawari.nem.dns,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\nawari_nem_probe.ps1" dns
# UserParameter=nawari.nem.wifi,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\nawari_nem_probe.ps1" wifi
# UserParameter=nawari.nem.service,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\nawari_nem_probe.ps1" service
# UserParameter=nawari.nem.all,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\nawari_nem_probe.ps1" all

# macOS UserParameters (Bash):
UserParameter=nawari.nem.gateway,/usr/local/bin/nawari_nem_probe.sh gateway
UserParameter=nawari.nem.dns,/usr/local/bin/nawari_nem_probe.sh dns
UserParameter=nawari.nem.wifi,/usr/local/bin/nawari_nem_probe.sh wifi
UserParameter=nawari.nem.service,/usr/local/bin/nawari_nem_probe.sh service
UserParameter=nawari.nem.all,/usr/local/bin/nawari_nem_probe.sh all

