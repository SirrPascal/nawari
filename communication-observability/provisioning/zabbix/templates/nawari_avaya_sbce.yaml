zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: a571017302484a0d8ea62287c24f6a9e
      name: Templates/Applications
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 4070a70cb0ff470dafc431b51c17924f
      template: 'Nawari Avaya SBCE by SNMP'
      name: 'Nawari Avaya SBCE by SNMP'
      description: |
        Nawari Avaya Session Border Controller Enterprise (SBCE) Monitoring Template.
        Inherits Nawari Generic SNMP Base and provides IF-MIB discovery for carrier/internal interfaces (A1, B1, M1),
        64-bit HC counters, voice path triggers, and appliance resource monitoring (CPU, RAM, Disk).
      templates:
        - name: 'Nawari Generic SNMP Base'
      groups:
        - name: Templates/Applications
        - name: 'Templates/Network devices'
      items:
        - uuid: 4070a70cb0ff470dafc431b51c179258
          name: 'SBCE Allocated Licenses Utilization'
          type: TRAP
          key: avaya.sbce.allocated_licenses_pct
          value_type: FLOAT
          units: '%'
          description: 'Percentage of provisioned SBC concurrent session licenses currently allocated.'
          tags:
            - tag: component
              value: capacity
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
          triggers:
            - uuid: 4070a70cb0ff470dafc431b51c179266
              expression: 'min(/Nawari Avaya SBCE by SNMP/avaya.sbce.allocated_licenses_pct,5m)>=90'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/avaya.sbce.allocated_licenses_pct,5m)<80'
              name: 'Avaya SBCE: License Utilization Limit Approached (>= 90%)'
              priority: HIGH
              description: 'SBCE allocated session licenses have reached 90% of total installed pool.'
              tags:
                - tag: component
                  value: capacity
                - tag: notification_class
                  value: degradation
                - tag: scope
                  value: capacity
        - uuid: 4070a70cb0ff470dafc431b51c179251
          name: 'Active SIP Calls'
          type: TRAP
          key: avaya.sbce.ems.active_calls
          units: calls
          description: |
            Number of currently active SIP calls reported by the Avaya SBCE statistics interface.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API or CLI scheduled export.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit). Awaiting live physical EMS connection.
            Source: SBCE EMS SIP Statistics Interface.
          tags:
            - tag: component
              value: sip-sessions
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
          triggers:
            - uuid: 4070a70cb0ff470dafc431b51c179261
              expression: 'nodata(/Nawari Avaya SBCE by SNMP/avaya.sbce.ems.active_calls,15m)=1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'nodata(/Nawari Avaya SBCE by SNMP/avaya.sbce.ems.active_calls,15m)=0'
              name: 'Avaya SBCE: Telemetry Stale or Loss of Monitoring'
              priority: WARNING
              description: 'No telemetry update received from Avaya SBCE EMS statistics interface for over 5 minutes.'
              tags:
                - tag: component
                  value: sip-sessions
                - tag: notification_class
                  value: monitoring_failure
                - tag: scope
                  value: availability
        - uuid: 4070a70cb0ff470dafc431b51c179252
          name: 'Active SIP Registrations'
          type: TRAP
          key: avaya.sbce.ems.active_registrations
          units: registrations
          description: |
            Current active subscriber SIP registrations registered across all transports (TCP, UDP, TLS) on Avaya SBCE.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit). Awaiting live physical EMS connection.
            Source: SBCE EMS SIP Statistics.
          tags:
            - tag: component
              value: sip-registrations
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
        - uuid: 4070a70cb0ff470dafc431b51c179253
          name: 'Active SRTP Encrypted Calls'
          type: TRAP
          key: avaya.sbce.ems.active_srtp_calls
          units: calls
          description: |
            Count of active voice media sessions utilizing Secure Real-Time Transport Protocol (SRTP) encryption.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit).
            Source: SBCE EMS SIP Statistics.
          tags:
            - tag: component
              value: media-security
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
        - uuid: 4070a70cb0ff470dafc431b51c179254
          name: 'Direct-Media Bypass Calls'
          type: TRAP
          key: avaya.sbce.ems.direct_media_calls
          units: calls
          description: |
            Count of active call sessions operating in direct-media (endpoint-to-endpoint bypass) mode without SBCE media anchoring.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit).
            Source: SBCE EMS SIP Statistics.
          tags:
            - tag: component
              value: media-flow
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
        - uuid: 4070a70cb0ff470dafc431b51c179255
          name: 'Dynamic License Utilization'
          type: TRAP
          key: avaya.sbce.ems.license_utilization_pct
          value_type: FLOAT
          units: '%'
          description: |
            Hourly dynamic license utilization percentage on Avaya SBCE.
            Collection Mechanism: Ingested via Avaya SBCE EMS License Usage Export.
            Note: License usage statistics are collected hourly by SBCE EMS; this must not be presented as a second-by-second live metric.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit).
            Source: SBCE EMS License Usage Export.
          tags:
            - tag: component
              value: capacity
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
          triggers:
            - uuid: 4070a70cb0ff470dafc431b51c179263
              expression: 'min(/Nawari Avaya SBCE by SNMP/avaya.sbce.ems.license_utilization_pct,3m)>=95'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/avaya.sbce.ems.license_utilization_pct,5m)<85'
              name: 'Avaya SBCE: Active Session Capacity Critical (>= 95%)'
              priority: HIGH
              description: 'Critical SIP session saturation on SBCE (> 95% license limit); activate failover routing immediately.'
              tags:
                - tag: component
                  value: capacity
                - tag: notification_class
                  value: degradation
                - tag: scope
                  value: capacity
            - uuid: 4070a70cb0ff470dafc431b51c179262
              expression: 'min(/Nawari Avaya SBCE by SNMP/avaya.sbce.ems.license_utilization_pct,5m)>=80'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/avaya.sbce.ems.license_utilization_pct,5m)<75'
              name: 'Avaya SBCE: Active Session Capacity Warning (>= 80%)'
              priority: WARNING
              description: 'Active concurrent SIP sessions exceed 80% of licensed capacity.'
              tags:
                - tag: component
                  value: capacity
                - tag: notification_class
                  value: degradation
                - tag: scope
                  value: capacity
        - uuid: 4070a70cb0ff470dafc431b51c179259
          name: 'SBCE Aggregate Interface Error Rate'
          type: TRAP
          key: avaya.sbce.if_error_rate_pct
          value_type: FLOAT
          units: '%'
          description: 'Aggregate interface error and packet discard percentage across all voice interfaces.'
          tags:
            - tag: component
              value: interface
            - tag: provenance
              value: REAL_HARDWARE
          triggers:
            - uuid: 4070a70cb0ff470dafc431b51c179267
              expression: 'min(/Nawari Avaya SBCE by SNMP/avaya.sbce.if_error_rate_pct,5m)>1'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/avaya.sbce.if_error_rate_pct,5m)<0.5'
              name: 'Avaya SBCE: Interface Packet Discards / Errors Elevated (> 1%)'
              priority: AVERAGE
              description: 'Packet errors and discards across SBCE voice interfaces exceed 1% over 5 minutes.'
              tags:
                - tag: component
                  value: interface
                - tag: notification_class
                  value: degradation
                - tag: scope
                  value: performance
        - uuid: 4070a70cb0ff470dafc431b51c179257
          name: 'SBCE SIP Failure Rate'
          type: TRAP
          key: avaya.sbce.sip_failure_rate_pct
          value_type: FLOAT
          units: '%'
          description: 'Percentage of SIP requests receiving 4xx/5xx failure responses over 5 minutes.'
          tags:
            - tag: component
              value: sip-signaling
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
          triggers:
            - uuid: 4070a70cb0ff470dafc431b51c179265
              expression: 'min(/Nawari Avaya SBCE by SNMP/avaya.sbce.sip_failure_rate_pct,5m)>5'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/avaya.sbce.sip_failure_rate_pct,5m)<2'
              name: 'Avaya SBCE: Sustained High SIP Failure Rate (> 5%)'
              priority: HIGH
              description: 'SIP signaling 4xx/5xx failure responses exceed 5% of processed call attempts over 5 minutes.'
              tags:
                - tag: component
                  value: sip-signaling
                - tag: notification_class
                  value: degradation
                - tag: scope
                  value: performance
        - uuid: 4070a70cb0ff470dafc431b51c179260
          name: 'SBCE Appliance Reachability'
          type: SIMPLE
          key: 'icmpping[10.2.156.131]'
          description: 'ICMP ping reachability to SBCE signaling and management IP.'
          tags:
            - tag: component
              value: infrastructure
            - tag: provenance
              value: REAL_ZABBIX
          triggers:
            - uuid: 4070a70cb0ff470dafc431b51c179268
              expression: 'max(/Nawari Avaya SBCE by SNMP/icmpping[10.2.156.131],#3)=0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/Nawari Avaya SBCE by SNMP/icmpping[10.2.156.131],#2)=1'
              name: 'Avaya SBCE: Appliance Unreachable'
              priority: DISASTER
              description: 'Avaya SBCE signaling or management IP is unresponsive to ICMP ping.'
              tags:
                - tag: component
                  value: sbce-core
                - tag: notification_class
                  value: total_outage
                - tag: scope
                  value: availability
        - uuid: 4070a70cb0ff470dafc431b51c179256
          name: 'SBCE Management Interface Reachability'
          type: SIMPLE
          key: 'net.tcp.service[https,10.2.156.131,443]'
          description: 'TCP/TLS connection to SBCE Element Management System (EMS) web management interface on port 443.'
          tags:
            - tag: component
              value: management
            - tag: provenance
              value: REAL_ZABBIX
          triggers:
            - uuid: 4070a70cb0ff470dafc431b51c179264
              expression: 'count(/Nawari Avaya SBCE by SNMP/net.tcp.service[https,10.2.156.131,443],#2,"eq",0)>=2'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'min(/Nawari Avaya SBCE by SNMP/net.tcp.service[https,10.2.156.131,443],#1)=1'
              name: 'Avaya SBCE: Management Interface Unreachable'
              priority: HIGH
              description: 'SBCE EMS management interface (HTTPS on port 443) failed consecutive health probes.'
              tags:
                - tag: component
                  value: management
                - tag: notification_class
                  value: degradation
                - tag: scope
                  value: availability
        - uuid: 3372b5e060c84216abfd10a25d55df2b
          name: 'Appliance 1-minute load average'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.10.1.3.1
          key: system.cpu.load.avg1
          value_type: FLOAT
          description: 'System 1-minute processor load average.'
          tags:
            - tag: component
              value: cpu
        - uuid: ac61babe96734f26a8d835addcff69fe
          name: 'Appliance CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.11.11.0
          key: system.cpu.util
          value_type: FLOAT
          units: '%'
          description: 'Percentage of CPU utilized across appliance processor cores.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return (100 - parseFloat(value));'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: e1e3fb6dbc004701a396b1e340671f1f
              expression: 'min(/Nawari Avaya SBCE by SNMP/system.cpu.util,5m)>85'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/system.cpu.util,5m)<70'
              name: 'Avaya SBCE: High CPU utilization (> {$CPU.UTIL.WARN}%)'
              priority: WARNING
              description: 'Appliance CPU utilization has exceeded warning threshold for over 5 minutes.'
              tags:
                - tag: notification_class
                  value: degradation
        - uuid: d83d571242aa4e59a09075cdd0de1ba6
          name: 'Appliance root filesystem space utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.9.1.9.1
          key: 'vfs.fs.used.percent[/]'
          delay: 5m
          value_type: FLOAT
          units: '%'
          description: 'Percentage of root filesystem (/) storage used.'
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: 85ab35d0e168455da19015986a978a49
              expression: 'min(/Nawari Avaya SBCE by SNMP/vfs.fs.used.percent[/],5m)>85'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/vfs.fs.used.percent[/],5m)<75'
              name: 'Avaya SBCE: High root filesystem disk usage (> {$DISK.UTIL.WARN}%)'
              priority: WARNING
              description: 'Root disk partition utilization exceeds warning threshold.'
              tags:
                - tag: notification_class
                  value: degradation
        - uuid: 4e2fb66f817045b7a12bc9f02d810242
          name: 'Appliance available physical memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.6.0
          key: vm.memory.available
          units: B
          description: 'Available memory for allocation without swapping.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 168d1d74cccb49f8a89900f3e403c2b8
          name: 'Appliance total physical memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.5.0
          key: vm.memory.total
          delay: 1h
          units: B
          description: 'Total real memory installed on the SBCE appliance.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          tags:
            - tag: component
              value: memory
        - uuid: 7c84cf95a8e44f54a91b3a64963dc8cd
          name: 'Appliance memory utilization'
          type: CALCULATED
          key: vm.memory.util
          value_type: FLOAT
          units: '%'
          params: '(1 - (last(//vm.memory.available) / last(//vm.memory.total))) * 100'
          description: 'Calculated physical memory utilization percentage.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 47b6bb5b445c46aea5eb5f36d6d68303
              expression: 'min(/Nawari Avaya SBCE by SNMP/vm.memory.util,5m)>90'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Avaya SBCE by SNMP/vm.memory.util,5m)<80'
              name: 'Avaya SBCE: High memory utilization (> {$MEMORY.UTIL.WARN}%)'
              priority: WARNING
              description: 'Appliance memory utilization has exceeded warning threshold for over 5 minutes.'
              tags:
                - tag: notification_class
                  value: degradation
      discovery_rules:
        - uuid: 4d62a0470270471ba69a3c710a8e9e8c
          name: 'SBCE interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1]'
          key: sbce.interface.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$SBCE.IF.MATCHES}'
              - macro: '{#IFNAME}'
                value: '{$SBCE.IF.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          item_prototypes:
            - uuid: 6aca0d7da7844a9aa1d7a469f9d7a9ee
              name: 'Interface {#IFNAME}: Administrative status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.adminstatus[ifAdminStatus.{#SNMPINDEX}]'
              delay: 5m
              description: 'Administrative state of interface (1 - up, 2 - down, 3 - testing).'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 6781178cd89940a2abb3633430bb77c1
              name: 'Interface {#IFNAME}: Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!pps'
              description: 'Inbound packet discard rate.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3a241c4f9df54d18aba7b1e32c3586f9
              name: 'Interface {#IFNAME}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!err/s'
              description: 'Inbound packet error rate on interface.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: c4d5bc9439fe4dabacfb3e5e9efa8e2d
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              value_type: FLOAT
              units: bps
              description: '64-bit high-capacity inbound traffic rate in bits/sec.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 8db374995bce449fa09dac9d54359c7e
              name: 'Interface {#IFNAME}: Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!pps'
              description: 'Outbound packet discard rate.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 0199cdc5c6a140b6a85df084263b6a06
              name: 'Interface {#IFNAME}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!err/s'
              description: 'Outbound packet error rate on interface.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 033abcf2cc2b4f6bae0130078c92e553
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              value_type: FLOAT
              units: bps
              description: '64-bit high-capacity outbound traffic rate in bits/sec.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a1e7488956974dfba003592450e3d4fa
              name: 'Interface {#IFNAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 5m
              units: bps
              description: 'High-speed interface nominal bandwidth in bits/second.'
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3df8f604a4564550a9556f2a08510710
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              description: 'Operational state of interface (1 - up, 2 - down).'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: 2f6fcb716b0f455ea162ee971a841e27
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Nawari Avaya SBCE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Nawari Avaya SBCE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=1'
                  name: 'Interface {#IFNAME}: Link down'
                  priority: HIGH
                  description: 'SBC interface operational state has transitioned to Down (2). Carrier SIP trunks or internal voice routing may be disrupted.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: interface
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: notification_class
                      value: component_failure
          trigger_prototypes:
            - uuid: 1c43b12ee4984e1aa2636b34cc8d2aa0
              expression: '(last(/Nawari Avaya SBCE by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}]) > (last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) * {$IF_UTIL_MAX} / 100) or last(/Nawari Avaya SBCE by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}]) > (last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) * {$IF_UTIL_MAX} / 100)) and last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) > 0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: '(last(/Nawari Avaya SBCE by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}]) < (last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) * 60 / 100) and last(/Nawari Avaya SBCE by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}]) < (last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) * 60 / 100))'
              name: 'Interface {#IFNAME}: High bandwidth utilization (> {$IF_UTIL_MAX}%)'
              priority: WARNING
              description: 'Inbound or outbound bandwidth exceeds the utilization threshold.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
                - tag: notification_class
                  value: degradation
            - uuid: 02751eba2f7148c1aedf3cc402bc51b1
