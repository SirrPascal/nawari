# ==============================================================================
# NAWARI — Total Outage Recipients & Kenya Airways IT Service Desk Specification
# ==============================================================================
version: "1"

user_groups:
  - name: "Nawari Total Outage Recipients"
    description: "Designated recipients for total outages and service downtime recovery notifications (Four communications administrators and KQ IT Service Desk)"
    gui_access: 0
    users_status: 0
    host_group_permissions:
      - group: "Voice Infrastructure"
        permission: 2
      - group: "Avaya Infrastructure"
        permission: 2
      - group: "Edge SBC"
        permission: 2
      - group: "SIP Carrier Trunks"
        permission: 2
      - group: "Communications Applications"
        permission: 2
      - group: "Synthetic Probes"
        permission: 2
      - group: "Core Network"
        permission: 2
      - group: "Endpoints"
        permission: 2

users:
