# ==============================================================================
# NAWARI — Avaya & Communications Administrators User Group & Notification Recipients
# ==============================================================================
version: "1"

user_groups:
  - name: "Nawari Avaya & Communications Administrators"
    description: "Designated voice engineering administrators receiving Avaya, SIP, and communications infrastructure alerts"
    gui_access: 0 # System default
    users_status: 0 # Enabled
    host_group_permissions:
      - group: "Voice Infrastructure"
        permission: 2 # Read-only
      - group: "Avaya Infrastructure"
        permission: 2
      - group: "Edge SBC"
        permission: 2
      - group: "SIP Carrier Trunks"
        permission: 2
      - group: "Communications Applications"
        permission: 2
      - group: "Synthetic Probes"
        permission: 2

users:
  - username: "john.gacomo"
    name: "John"
    surname: "Gacomo"
    role: "Admin role"
    groups:
      - "Nawari Avaya & Communications Administrators"
    medias:
      - mediatype: "Email"
        sendto: "John.Gacomo@kenya-airways.com"
        active: 0 # Enabled
        severity: 63 # Information (1), Warning (2), Average (4), High (8), Disaster (16), Not classified (32) = 63
        period: "1-7,00:00-24:00"

