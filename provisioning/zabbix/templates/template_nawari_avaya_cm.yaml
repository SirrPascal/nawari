zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
    - uuid: a571017302484a0d8ea62287c24f6a9e
      name: 'Templates/Applications'
  templates:
    - uuid: c1a2b3c4d5e6470dafc431b51c17924f
      template: 'Nawari Avaya Communication Manager by SNMP'
      name: 'Nawari Avaya Communication Manager by SNMP'
      description: |
        Nawari Avaya Aura Communication Manager (CM 8.1.0) Performance and IP Voice Quality Template.
        Collects real-call transport and call processing metrics from official Avaya MIB tables (OID 1.3.6.1.4.1.6889.2.73):
        - avCmMeasIpVoStatSumDataLstHrTable (1.3.6.1.4.1.6889.2.73.8.1.77): Hourly real-call packet loss %, peak jitter, peak two-way delay, codec, echo cancellation, network region. Delay strictly >= 1h.
        - avCmMeasIpVoStatHrJitterTable (1.3.6.1.4.1.6889.2.73.8.1.66): Hourly average jitter and evaluated call counts. Delay strictly >= 1h.
        - avCmAlarms (1.3.6.1.4.1.6889.2.73.1): Active alarms count. Delay >= 1h (large table traversal conservation).
        - avCmListMeasCallRateTotal (1.3.6.1.4.1.6889.2.73.8.1.1): Total call attempts and completed call rate. Polling strictly capped at 5 minutes (delay: 5m) to prevent system impact on CM processor.
        Requires 'IP Voice Stats Summary? y' enabled under 'change system-parameters ip-options'.
      groups:
        - name: 'Templates/Applications'
        - name: 'Templates/Network devices'
      items:
        - uuid: 88aa11bb22cc470dafc431b51c179201
          name: 'Real-Call Packet Loss (Last Hour)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.77.1.6.1
          key: avaya.cm.ip_voice.loss_pct
          delay: 1h
          value_type: FLOAT
          units: '%'
          description: |
            Percentage of IP audio packets lost during active calls in the last completed hour across primary network region.
            Source: Avaya CM SNMP table avCmMeasIpVoStatSumDataLstHrTable (leaf .6). Polling interval: 1 hour.
          tags:
            - tag: component
              value: voice-transport
            - tag: provenance
              value: REAL_AVAYA_SNMP
          triggers:
            - uuid: 88aa11bb22cc470dafc431b51c179211
              expression: 'last(/Nawari Avaya Communication Manager by SNMP/avaya.cm.ip_voice.loss_pct)>2.5'
              name: 'Avaya CM: Real-Call Packet Loss High (> 2.5% in Last Hour)'
              priority: WARNING
              description: 'Hourly real-call packet loss on Avaya Communication Manager exceeded 2.5% threshold.'

        - uuid: 88aa11bb22cc470dafc431b51c179202
          name: 'Real-Call Peak Jitter (Last Hour)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.77.1.7.1
          key: avaya.cm.ip_voice.peak_jitter
          delay: 1h
          value_type: FLOAT
          units: ms
          description: |
            Maximum interarrival packet jitter in milliseconds observed during active calls in the last completed hour.
            Source: Avaya CM SNMP table avCmMeasIpVoStatSumDataLstHrTable (leaf .7). Polling interval: 1 hour.
          tags:
            - tag: component
              value: voice-transport
            - tag: provenance
              value: REAL_AVAYA_SNMP
          triggers:
            - uuid: 88aa11bb22cc470dafc431b51c179212
              expression: 'last(/Nawari Avaya Communication Manager by SNMP/avaya.cm.ip_voice.peak_jitter)>30'
              name: 'Avaya CM: Real-Call Peak Jitter High (> 30 ms)'
              priority: WARNING
              description: 'Hourly real-call peak jitter on Avaya Communication Manager exceeded 30 ms.'

        - uuid: 88aa11bb22cc470dafc431b51c179203
          name: 'Real-Call Peak Two-Way Delay (Last Hour)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.77.1.8.1
          key: avaya.cm.ip_voice.peak_delay
          delay: 1h
          value_type: FLOAT
          units: ms
          description: |
            Maximum two-way round-trip audio packet delay in milliseconds observed during active calls in the last completed hour.
            Source: Avaya CM SNMP table avCmMeasIpVoStatSumDataLstHrTable (leaf .8). Polling interval: 1 hour.
          tags:
            - tag: component
              value: voice-transport
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179204
          name: 'Real-Call Hourly Average Jitter'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.66.1.2.1
          key: avaya.cm.ip_voice.avg_jitter
          delay: 1h
          value_type: FLOAT
          units: ms
          description: |
            Average interarrival packet jitter in milliseconds calculated across all calls in the last completed hour.
            Source: Avaya CM SNMP table avCmMeasIpVoStatHrJitterTable (leaf .2). Polling interval: 1 hour.
          tags:
            - tag: component
              value: voice-transport
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179205
          name: 'Real-Call Evaluated Calls Count'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.66.1.4.1
          key: avaya.cm.ip_voice.call_count
          delay: 1h
          value_type: UNSIGNED
          units: calls
          description: |
            Total number of IP voice calls evaluated by Communication Manager during the last completed hour.
            Source: Avaya CM SNMP table avCmMeasIpVoStatHrJitterTable (leaf .4). Polling interval: 1 hour.
          tags:
            - tag: component
              value: call-volume
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179206
          name: 'Negotiated Audio Codec'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.77.1.3.1
          key: avaya.cm.ip_voice.codec
          delay: 1h
          value_type: CHAR
          description: |
            Primary negotiated voice compression algorithm / codec (e.g. G.711A, G.711U, G.729) in the active network region.
            Source: Avaya CM SNMP table avCmMeasIpVoStatSumDataLstHrTable (leaf .3). Polling interval: 1 hour.
          tags:
            - tag: component
              value: codec
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179208
          name: 'Active Alarms Count'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.5.1.2.1
          key: avaya.cm.alarms.active_count
          delay: 1h
          value_type: UNSIGNED
          units: alarms
          description: |
            Total number of unresolved active alarms currently registered on the Communication Manager server.
            Source: Avaya CM 8.1 SNMP table avCmAlarmsTable (group OID 1.3.6.1.4.1.6889.2.73.8.1.5).
            Polling interval: strictly 1 hour (vendor specified CPU conservation limit).
            Note: Discrepancy resolved in Phase 13.2 audit — replaced legacy G3 OID (6889.2.8.1.13) with official Aura CM 8.1 OID (6889.2.73.8.1.5).
          tags:
            - tag: component
              value: alarms
            - tag: provenance
              value: REAL_AVAYA_SNMP
          triggers:
            - uuid: 88aa11bb22cc470dafc431b51c179218
              expression: 'last(/Nawari Avaya Communication Manager by SNMP/avaya.cm.alarms.active_count)>0'
              name: 'Avaya CM: Active Telephony Alarms Present'
              priority: AVERAGE
              description: 'Communication Manager has active alarm conditions requiring engineering review.'

        - uuid: 88aa11bb22cc470dafc431b51c179209
          name: 'Call Rate Total Attempts (5-minute)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.145.1.2.1
          key: avaya.cm.call_rate.attempts
          delay: 5m
          value_type: UNSIGNED
          units: calls
          description: |
            Total call attempts processed by Communication Manager in the preceding 5-minute sampling interval.
            Source: Avaya CM 8.1 SNMP table avCmListMeasCallRateTotalTable (group OID 1.3.6.1.4.1.6889.2.73.8.1.145, leaf .1.2.1).
            Polling interval: strictly 5 minutes (vendor specified rate-limiting bound).
            Note: Discrepancy resolved in Phase 13.2 audit — corrected group index from .1 to official .145 table.
          tags:
            - tag: component
              value: call-rate
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179210
          name: 'Call Rate Completed Calls (5-minute)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.145.1.3.1
          key: avaya.cm.call_rate.completed
          delay: 5m
          value_type: UNSIGNED
          units: calls
          description: |
            Total successfully completed call connections processed in the preceding 5-minute sampling interval.
            Source: Avaya CM 8.1 SNMP table avCmListMeasCallRateTotalTable (group OID 1.3.6.1.4.1.6889.2.73.8.1.145, leaf .1.3.1).
            Polling interval: strictly 5 minutes (vendor specified rate-limiting bound).
          tags:
            - tag: component
              value: call-rate
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179213
          name: 'Echo Cancellation Status'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.77.1.11.1
          key: avaya.cm.ip_voice.echo_cancellation
          delay: 1h
          value_type: CHAR
          description: |
            Operational status of hardware/software echo cancellation on voice paths for the measured network region.
            Source: Avaya CM SNMP table avCmMeasIpVoStatSumDataLstHrTable (leaf .11). Polling interval: 1 hour.
          tags:
            - tag: component
              value: voice-transport
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179214
          name: 'Voice Telemetry Network Region ID'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.6889.2.73.8.1.77.1.4.1
          key: avaya.cm.ip_voice.network_region
          delay: 1h
          value_type: UNSIGNED
          description: |
            Numeric network region identifier corresponding to the reported hourly voice measurement statistics.
            Source: Avaya CM SNMP table avCmMeasIpVoStatSumDataLstHrTable (leaf .4). Polling interval: 1 hour.
          tags:
            - tag: component
              value: voice-transport
            - tag: provenance
              value: REAL_AVAYA_SNMP

        - uuid: 88aa11bb22cc470dafc431b51c179207
          name: 'Communication Manager SNMP Availability'
          type: SIMPLE
          key: 'icmpping[10.102.10.25]'
          delay: 1m
          value_type: UNSIGNED
          description: |
            Network ICMP reachability to the Avaya Communication Manager processor interface.
            1 = UP, 0 = DOWN. Polling interval: 1 minute.
          tags:
            - tag: component
              value: infrastructure
            - tag: provenance
              value: REAL_ZABBIX
