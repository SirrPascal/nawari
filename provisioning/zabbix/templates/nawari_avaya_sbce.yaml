zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
    - uuid: a571017302484a0d8ea62287c24f6a9e
      name: 'Templates/Applications'
  templates:
    - uuid: 4070a70cb0ff470dafc431b51c17924f
      template: 'Nawari Avaya SBCE by SNMP'
      name: 'Nawari Avaya SBCE by SNMP'
      description: |
        Nawari Avaya Session Border Controller Enterprise (SBCE) Monitoring Template.
        Inherits Nawari Generic SNMP Base and provides IF-MIB discovery for carrier/internal interfaces (A1, B1, M1),
        64-bit HC counters, voice path triggers, and appliance resource monitoring (CPU, RAM, Disk).
      groups:
        - name: 'Templates/Network devices'
        - name: 'Templates/Applications'
      templates:
        - name: 'Nawari Generic SNMP Base'
      items:
        - uuid: ac61babe96734f26a8d835addcff69fe
          name: 'Appliance CPU utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.11.11.0
          key: system.cpu.util
          delay: 1m
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - 'return (100 - parseFloat(value));'
          description: 'Percentage of CPU utilized across appliance processor cores.'
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: e1e3fb6dbc004701a396b1e340671f1f
              expression: 'min(/Nawari Avaya SBCE by SNMP/system.cpu.util,5m)>{$CPU.UTIL.WARN}'
              name: 'Avaya SBCE: High CPU utilization (> {$CPU.UTIL.WARN}%)'
              priority: WARNING
              description: 'Appliance CPU utilization has exceeded warning threshold for over 5 minutes.'
        - uuid: 3372b5e060c84216abfd10a25d55df2b
          name: 'Appliance 1-minute load average'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.10.1.3.1
          key: system.cpu.load.avg1
          delay: 1m
          value_type: FLOAT
          description: 'System 1-minute processor load average.'
          tags:
            - tag: component
              value: cpu
        - uuid: 168d1d74cccb49f8a89900f3e403c2b8
          name: 'Appliance total physical memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.5.0
          key: vm.memory.total
          delay: 1h
          value_type: UNSIGNED
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          description: 'Total real memory installed on the SBCE appliance.'
          tags:
            - tag: component
              value: memory
        - uuid: 4e2fb66f817045b7a12bc9f02d810242
          name: 'Appliance available physical memory'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.4.6.0
          key: vm.memory.available
          delay: 1m
          value_type: UNSIGNED
          units: B
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '1024'
          description: 'Available memory for allocation without swapping.'
          tags:
            - tag: component
              value: memory
        - uuid: 7c84cf95a8e44f54a91b3a64963dc8cd
          name: 'Appliance memory utilization'
          type: CALCULATED
          key: vm.memory.util
          params: '(1 - (last(//vm.memory.available) / last(//vm.memory.total))) * 100'
          delay: 1m
          value_type: FLOAT
          units: '%'
          description: 'Calculated physical memory utilization percentage.'
          tags:
            - tag: component
              value: memory
          triggers:
            - uuid: 47b6bb5b445c46aea5eb5f36d6d68303
              expression: 'min(/Nawari Avaya SBCE by SNMP/vm.memory.util,5m)>{$MEMORY.UTIL.WARN}'
              name: 'Avaya SBCE: High memory utilization (> {$MEMORY.UTIL.WARN}%)'
              priority: WARNING
              description: 'Appliance memory utilization has exceeded warning threshold for over 5 minutes.'
        - uuid: d83d571242aa4e59a09075cdd0de1ba6
          name: 'Appliance root filesystem space utilization'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.2021.9.1.9.1
          key: 'vfs.fs.used.percent[/]'
          delay: 5m
          value_type: FLOAT
          units: '%'
          description: 'Percentage of root filesystem (/) storage used.'
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: 85ab35d0e168455da19015986a978a49
              expression: 'last(/Nawari Avaya SBCE by SNMP/vfs.fs.used.percent[/])>{$DISK.UTIL.WARN}'
              name: 'Avaya SBCE: High root filesystem disk usage (> {$DISK.UTIL.WARN}%)'
              priority: WARNING
              description: 'Root disk partition utilization exceeds warning threshold.'
        - uuid: 4070a70cb0ff470dafc431b51c179251
          name: 'Active SIP Calls'
          type: TRAP
          key: avaya.sbce.ems.active_calls
          delay: '0'
          value_type: UNSIGNED
          units: calls
          description: |
            Number of currently active SIP calls reported by the Avaya SBCE statistics interface.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API or CLI scheduled export.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit). Awaiting live physical EMS connection.
            Source: SBCE EMS SIP Statistics Interface.
          tags:
            - tag: component
              value: sip-sessions
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
        - uuid: 4070a70cb0ff470dafc431b51c179252
          name: 'Active SIP Registrations'
          type: TRAP
          key: avaya.sbce.ems.active_registrations
          delay: '0'
          value_type: UNSIGNED
          units: registrations
          description: |
            Current active subscriber SIP registrations registered across all transports (TCP, UDP, TLS) on Avaya SBCE.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit). Awaiting live physical EMS connection.
            Source: SBCE EMS SIP Statistics.
          tags:
            - tag: component
              value: sip-registrations
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
        - uuid: 4070a70cb0ff470dafc431b51c179253
          name: 'Active SRTP Encrypted Calls'
          type: TRAP
          key: avaya.sbce.ems.active_srtp_calls
          delay: '0'
          value_type: UNSIGNED
          units: calls
          description: |
            Count of active voice media sessions utilizing Secure Real-Time Transport Protocol (SRTP) encryption.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit).
            Source: SBCE EMS SIP Statistics.
          tags:
            - tag: component
              value: media-security
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
        - uuid: 4070a70cb0ff470dafc431b51c179254
          name: 'Direct-Media Bypass Calls'
          type: TRAP
          key: avaya.sbce.ems.direct_media_calls
          delay: '0'
          value_type: UNSIGNED
          units: calls
          description: |
            Count of active call sessions operating in direct-media (endpoint-to-endpoint bypass) mode without SBCE media anchoring.
            Collection Mechanism: Ingested via Avaya SBCE EMS Statistics REST API.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit).
            Source: SBCE EMS SIP Statistics.
          tags:
            - tag: component
              value: media-flow
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
        - uuid: 4070a70cb0ff470dafc431b51c179255
          name: 'Dynamic License Utilization'
          type: TRAP
          key: avaya.sbce.ems.license_utilization_pct
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: |
            Hourly dynamic license utilization percentage on Avaya SBCE.
            Collection Mechanism: Ingested via Avaya SBCE EMS License Usage Export.
            Note: License usage statistics are collected hourly by SBCE EMS; this must not be presented as a second-by-second live metric.
            Status: CONFIGURED_UNVERIFIED (Phase 13.2 audit).
            Source: SBCE EMS License Usage Export.
          tags:
            - tag: component
              value: capacity
            - tag: provenance
              value: CONFIGURED_UNVERIFIED
      discovery_rules:
        - uuid: 4d62a0470270471ba69a3c710a8e9e8c
          name: 'SBCE interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1]'
          key: sbce.interface.discovery
          delay: 1m
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$SBCE.IF.MATCHES}'
                operator: MATCHES_REGEX
                formulaid: A
              - macro: '{#IFNAME}'
                value: '{$SBCE.IF.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          item_prototypes:
            - uuid: 3df8f604a4564550a9556f2a08510710
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              delay: 1m
              value_type: UNSIGNED
              description: 'Operational state of interface (1 - up, 2 - down).'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 6aca0d7da7844a9aa1d7a469f9d7a9ee
              name: 'Interface {#IFNAME}: Administrative status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.adminstatus[ifAdminStatus.{#SNMPINDEX}]'
              delay: 5m
              value_type: UNSIGNED
              description: 'Administrative state of interface (1 - up, 2 - down, 3 - testing).'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: a1e7488956974dfba003592450e3d4fa
              name: 'Interface {#IFNAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}'
              key: 'net.if.speed[ifHighSpeed.{#SNMPINDEX}]'
              delay: 5m
              value_type: UNSIGNED
              units: bps
              preprocessing:
                - type: MULTIPLIER
                  parameters:
                    - '1000000'
              description: 'High-speed interface nominal bandwidth in bits/second.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: c4d5bc9439fe4dabacfb3e5e9efa8e2d
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}'
              key: 'net.if.in[ifHCInOctets.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              description: '64-bit high-capacity inbound traffic rate in bits/sec.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 033abcf2cc2b4f6bae0130078c92e553
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}'
              key: 'net.if.out[ifHCOutOctets.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: bps
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              description: '64-bit high-capacity outbound traffic rate in bits/sec.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 3a241c4f9df54d18aba7b1e32c3586f9
              name: 'Interface {#IFNAME}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: '!err/s'
              preprocessing:
                - type: CHANGE_PER_SECOND
              description: 'Inbound packet error rate on interface.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 0199cdc5c6a140b6a85df084263b6a06
              name: 'Interface {#IFNAME}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: '!err/s'
              preprocessing:
                - type: CHANGE_PER_SECOND
              description: 'Outbound packet error rate on interface.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 6781178cd89940a2abb3633430bb77c1
              name: 'Interface {#IFNAME}: Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: '!pps'
              preprocessing:
                - type: CHANGE_PER_SECOND
              description: 'Inbound packet discard rate.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 8db374995bce449fa09dac9d54359c7e
              name: 'Interface {#IFNAME}: Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              delay: 1m
              value_type: FLOAT
              units: '!pps'
              preprocessing:
                - type: CHANGE_PER_SECOND
              description: 'Outbound packet discard rate.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
          trigger_prototypes:
            - uuid: 2f6fcb716b0f455ea162ee971a841e27
              expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Nawari Avaya SBCE by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2'
              name: 'Interface {#IFNAME}: Link down'
              priority: HIGH
              description: 'SBC interface operational state has transitioned to Down (2). Carrier SIP trunks or internal voice routing may be disrupted.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 1c43b12ee4984e1aa2636b34cc8d2aa0
              expression: '(last(/Nawari Avaya SBCE by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}]) > (last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) * {$IF_UTIL_MAX} / 100) or last(/Nawari Avaya SBCE by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}]) > (last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) * {$IF_UTIL_MAX} / 100)) and last(/Nawari Avaya SBCE by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) > 0'
              name: 'Interface {#IFNAME}: High bandwidth utilization (> {$IF_UTIL_MAX}%)'
              priority: WARNING
              description: 'Inbound or outbound bandwidth exceeds the utilization threshold.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 02751eba2f7148c1aedf3cc402bc51b1
              expression: 'min(/Nawari Avaya SBCE by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF_ERRORS_WARN} or min(/Nawari Avaya SBCE by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF_ERRORS_WARN}'
              name: 'Interface {#IFNAME}: High error rate (> {$IF_ERRORS_WARN} err/s)'
              priority: WARNING
              description: 'Packet errors detected on SBC voice interface exceeding threshold.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
      macros:
        - macro: '{$SBCE.IF.MATCHES}'
          value: '^(M[1-2]|A[1-2]|B[1-2]|sbc-.*|ge-0-0-[1-2]|eth[0-9]+)$'
          description: 'Regex filter matching Avaya SBCE and mock interfaces'
        - macro: '{$SBCE.IF.NOT_MATCHES}'
          value: '^(lo|gre.*|tunl.*|sit.*|erspan.*|ip6.*)$'
          description: 'Regex filter excluding loopbacks and tunnel links'
        - macro: '{$CPU.UTIL.WARN}'
          value: '85'
          description: 'Warning threshold for SBCE CPU utilization percentage'
        - macro: '{$MEMORY.UTIL.WARN}'
          value: '90'
          description: 'Warning threshold for SBCE memory utilization percentage'
        - macro: '{$DISK.UTIL.WARN}'
          value: '85'
          description: 'Warning threshold for root disk space usage percentage'
        - macro: '{$IFCONTROL}'
          value: '1'
          description: 'Control link-down alerting (1: enabled, 0: disabled)'
        - macro: '{$IF_UTIL_MAX}'
          value: '80'
          description: 'Bandwidth utilization warning threshold in percent'
        - macro: '{$IF_ERRORS_WARN}'
          value: '2'
          description: 'Interface error rate threshold in errors per second'

