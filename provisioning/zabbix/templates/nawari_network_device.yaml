zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: 36bff6c29af64692839d077febfc7079
      name: 'Templates/Network devices'
  templates:
    - uuid: 0763595a7683432eae05eda6342d8bd0
      template: 'Nawari Network Device by SNMP'
      name: 'Nawari Network Device by SNMP'
      description: |
        Nawari Enterprise Network Device Monitoring Template.
        Inherits Nawari Generic SNMP Base and provides IF-MIB network interface discovery,
        bandwidth metrics (bps), error/discard rates, and operational state triggers.
      templates:
        - name: 'Nawari Generic SNMP Base'
      groups:
        - name: 'Templates/Network devices'
      discovery_rules:
        - uuid: 740a5ff1ea414f0bade852966a9b48aa
          name: 'Network interfaces discovery'
          type: SNMP_AGENT
          snmp_oid: 'discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7]'
          key: net.if.discovery
          filter:
            evaltype: AND
            conditions:
              - macro: '{#IFNAME}'
                value: '{$NET.IF.IFNAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          item_prototypes:
            - uuid: d64fcf9fa02e436fa18e94e6d3d6c39c
              name: 'Interface {#IFNAME}: Administrative status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}'
              key: 'net.if.adminstatus[ifAdminStatus.{#SNMPINDEX}]'
              delay: 5m
              description: 'Desired state of interface (1 - up, 2 - down, 3 - testing).'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 52256cf4a659471fa63c37b893174f91
              name: 'Interface {#IFNAME}: Inbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}'
              key: 'net.if.in.discards[ifInDiscards.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!pps'
              description: 'Inbound packets discarded to free buffer space.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: d92e9e0f51af46aaacf3a7d9c9a0ef90
              name: 'Interface {#IFNAME}: Inbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}'
              key: 'net.if.in.errors[ifInErrors.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!err/s'
              description: 'Inbound packets containing errors preventing delivery.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: fce5b8fd82f34f98a20c281407df6e3a
              name: 'Interface {#IFNAME}: Bits received'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.10.{#SNMPINDEX}'
              key: 'net.if.in[ifInOctets.{#SNMPINDEX}]'
              value_type: FLOAT
              units: bps
              description: 'Inbound traffic rate in bits per second.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 9b4dfbd619ac42d6a26e3bbbc48b1bdc
              name: 'Interface {#IFNAME}: Outbound packets discarded'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}'
              key: 'net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!pps'
              description: 'Outbound packets discarded to free buffer space.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 1a3e7d97b2c246a7ae209031eb1d8971
              name: 'Interface {#IFNAME}: Outbound errors'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}'
              key: 'net.if.out.errors[ifOutErrors.{#SNMPINDEX}]'
              value_type: FLOAT
              units: '!err/s'
              description: 'Outbound packets containing errors preventing transmission.'
              preprocessing:
                - type: CHANGE_PER_SECOND
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: 666db13195b24503a4810461701caf8a
              name: 'Interface {#IFNAME}: Bits sent'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.16.{#SNMPINDEX}'
              key: 'net.if.out[ifOutOctets.{#SNMPINDEX}]'
              value_type: FLOAT
              units: bps
              description: 'Outbound traffic rate in bits per second.'
              preprocessing:
                - type: CHANGE_PER_SECOND
                - type: MULTIPLIER
                  parameters:
                    - '8'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: da0737dcf3d34e3ea5d352167e03f42d
              name: 'Interface {#IFNAME}: Speed'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.5.{#SNMPINDEX}'
              key: 'net.if.speed[ifSpeed.{#SNMPINDEX}]'
              delay: 5m
              units: bps
              description: 'Estimated or nominal bandwidth of the interface in bits/sec.'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
            - uuid: decaeb098b564fc0aefdc355023d473d
              name: 'Interface {#IFNAME}: Operational status'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}'
              key: 'net.if.status[ifOperStatus.{#SNMPINDEX}]'
              description: 'Operational state of interface (1 - up, 2 - down).'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
              trigger_prototypes:
                - uuid: e4f6edc05cc74082a6f7580cbac0966a
                  expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Nawari Network Device by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'last(/Nawari Network Device by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=1'
                  name: 'Interface {#IFNAME}: Link down'
                  priority: AVERAGE
                  description: 'Operational status transitioned to Down (2).'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: interface
                    - tag: interface
                      value: '{#IFNAME}'
                    - tag: notification_class
                      value: component_failure
          trigger_prototypes:
            - uuid: bb407ebc76b243e7aff658e2b2043830
              expression: '(last(/Nawari Network Device by SNMP/net.if.in[ifInOctets.{#SNMPINDEX}]) > (last(/Nawari Network Device by SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}]) * {$IF_UTIL_MAX} / 100) or last(/Nawari Network Device by SNMP/net.if.out[ifOutOctets.{#SNMPINDEX}]) > (last(/Nawari Network Device by SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}]) * {$IF_UTIL_MAX} / 100)) and last(/Nawari Network Device by SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}]) > 0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: '(last(/Nawari Network Device by SNMP/net.if.in[ifInOctets.{#SNMPINDEX}]) < (last(/Nawari Network Device by SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}]) * 60 / 100) and last(/Nawari Network Device by SNMP/net.if.out[ifOutOctets.{#SNMPINDEX}]) < (last(/Nawari Network Device by SNMP/net.if.speed[ifSpeed.{#SNMPINDEX}]) * 60 / 100))'
              name: 'Interface {#IFNAME}: High bandwidth utilization (> {$IF_UTIL_MAX}%)'
              priority: WARNING
              description: 'Inbound or outbound bandwidth exceeds the utilization threshold.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
                - tag: notification_class
                  value: degradation
            - uuid: f2f2f0d4c2724f5aa14933d9cc082d73
              expression: 'min(/Nawari Network Device by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF_ERRORS_WARN} or min(/Nawari Network Device by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF_ERRORS_WARN}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Nawari Network Device by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<1 and max(/Nawari Network Device by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<1'
              name: 'Interface {#IFNAME}: High error rate (> {$IF_ERRORS_WARN} err/s)'
              priority: WARNING
              description: 'Interface error rate exceeds configured threshold over 5 minutes.'
              manual_close: 'YES'
              tags:
                - tag: component
                  value: interface
                - tag: interface
                  value: '{#IFNAME}'
                - tag: notification_class
                  value: degradation
      macros:
        - macro: '{$IFCONTROL}'
          value: '1'
          description: 'Control link-down trigger per interface or globally (1: enabled, 0: disabled)'
        - macro: '{$IF_ERRORS_WARN}'
          value: '2'
          description: 'Threshold for inbound/outbound error rate warning'
        - macro: '{$IF_UTIL_MAX}'
          value: '80'
          description: 'Warning threshold for interface bandwidth utilization in %'
        - macro: '{$NET.IF.IFNAME.NOT_MATCHES}'
          value: '^(lo|gre0|tunl0|sit0|erspan0|gretap0|ip_vti0|ip6.*)$'
          description: 'Regular expression to filter out loopback and virtual tunnel interfaces from discovery'
