zabbix_export:
  version: '7.4'
  actions:
    - name: 'Nawari Communication Infrastructure Notifications'
      events_source: TRIGGERS
      status: ENABLED
      esc_period: 30m
      pause_suppressed: 'YES'
      filter:
        evaltype: OR
        conditions:
          - conditiontype: TRIGGER_TAG
            operator: EQUAL
            tag: scope
            value: availability
          - conditiontype: TRIGGER_TAG
            operator: EQUAL
            tag: scope
            value: performance
          - conditiontype: HOST_GROUP
            operator: EQUAL
            value: 'Voice Infrastructure'
          - conditiontype: HOST_GROUP
            operator: EQUAL
            value: 'Edge SBC'
          - conditiontype: HOST_GROUP
            operator: EQUAL
            value: 'Telephony'
      operations:
        - operationtype: MESSAGE
          esc_step_from: 1
          esc_step_to: 1
          user_groups:
            - name: 'NOC / VOC Duty Operators'
          mediatype:
            name: 'Microsoft 365 Email'
        - operationtype: MESSAGE
          esc_step_from: 2
          esc_step_to: 5
          esc_period: 30m
          user_groups:
            - name: 'NOC / VOC Duty Operators'
          mediatype:
            name: 'Microsoft 365 Email'
      recovery_operations:
        - operationtype: RECOVERY_MESSAGE
          mediatype:
            name: 'Microsoft 365 Email'
      update_operations:
        - operationtype: UPDATE_MESSAGE
          mediatype:
            name: 'Microsoft 365 Email'

