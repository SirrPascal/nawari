# ==============================================================================
# NAWARI — Enterprise Host Kernel Parameter Hardening (Ubuntu 24.04 LTS)
# Target: mon-grafana01 (2 vCPU, 7.8 GiB RAM, 4 GiB Swap)
# Path: /etc/sysctl.d/99-nawari-hardening.conf
# ==============================================================================

# 1. Virtual Memory & Swapping Optimization
# Avoid aggressive swapping onto the 4 GiB swap partition under transient spikes
vm.swappiness = 10
# Sufficient map count for PostgreSQL and container runtimes
vm.max_map_count = 262144
# Overcommit ratio conservative configuration
vm.overcommit_memory = 0

# 2. File Descriptors & Socket Backlog
# High descriptor limit for Zabbix server, PostgreSQL connections, and Ingestion Gateway
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# 3. Network Stack Hardening & Performance
# Socket listen backlog for concurrent HTTP/SNMP burst ingestion
net.core.somaxconn = 4096
net.ipv4.tcp_max_syn_backlog = 4096
net.core.netdev_max_backlog = 10000

# Protection against SYN floods
net.ipv4.tcp_syncookies = 1

# Disable IP source routing and ICMP redirect acceptance
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

# Enable Docker bridge forwarding while preventing rogue forwarding
net.ipv4.ip_forward = 1

# Log martian packets (spoofed addresses or impossible routes)
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast ICMP echo requests (Smurf attack prevention)
net.ipv4.icmp_echo_ignore_broadcasts = 1
