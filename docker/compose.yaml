# ==============================================================================
# NAWARI — Enterprise Network & Communications Observability Platform
# Core Docker Compose Definition (Phase 1 Baseline)
# ==============================================================================

name: nawari

networks:
  nawari-internal:
    name: nawari-internal
    driver: bridge

volumes:
  postgres-data:
    name: ${POSTGRES_DATA_VOLUME:-nawari-postgres-data}
  snmptrap-spool:
    name: ${SNMPTRAP_SPOOL_VOLUME:-nawari-snmptrap-spool}
  grafana-data:
    name: ${GRAFANA_DATA_VOLUME:-nawari-grafana-data}
  zabbix-mibs:
    name: ${ZABBIX_MIBS_VOLUME:-nawari-zabbix-mibs}

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 17 - Relational Telemetry & State Store
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: nawari-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-zabbix}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-zabbix}
      - TZ=UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nawari-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER:-zabbix} -d ${POSTGRES_DB:-zabbix}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 2. Zabbix SNMP Traps Receiver Daemon (snmptrapd)
  # ----------------------------------------------------------------------------
  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:${ZABBIX_IMAGE_TAG:-alpine-7.4.0}
    container_name: nawari-snmptraps
    restart: unless-stopped
    environment:
      - ZBX_SNMPTRAPPERDIR=/var/lib/zabbix/snmptraps
    volumes:
      - snmptrap-spool:/var/lib/zabbix/snmptraps
      - zabbix-mibs:/usr/share/snmp/mibs:ro
    networks:
      - nawari-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 3. Zabbix 7.4 Server (PostgreSQL Engine)
  # ----------------------------------------------------------------------------
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_IMAGE_TAG:-alpine-7.4.0}
    container_name: nawari-zabbix-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-snmptraps:
        condition: service_started
    environment:
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-zabbix}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-zabbix}
      - ZBX_ENABLE_SNMP_TRAPS=true
      - ZBX_SNMPTRAPPERDIR=/var/lib/zabbix/snmptraps
      - ZBX_STARTPINGERS=5
      - ZBX_STARTPOLLERS=5
      - ZBX_STARTPOLLERSUNREACHABLE=3
      - ZBX_STARTTRAPPERS=5
      - ZBX_HOUSEKEEPINGFREQUENCY=1
      - ZBX_MAXHOUSEKEEPERDELETE=500
    volumes:
      - snmptrap-spool:/var/lib/zabbix/snmptraps:ro
      - zabbix-mibs:/usr/share/snmp/mibs:ro
    networks:
      - nawari-internal
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 4. Zabbix 7.4 Web Frontend (NGINX / PHP-FPM)
  # ----------------------------------------------------------------------------
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_IMAGE_TAG:-alpine-7.4.0}
    container_name: nawari-zabbix-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=10051
      - DB_SERVER_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER:-zabbix}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - POSTGRES_DB=${POSTGRES_DB:-zabbix}
      - PHP_TZ=Africa/Nairobi
    networks:
      - nawari-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/index.php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Grafana 11.6+ (Operations Visualizer with Pinned Zabbix App Plugin)
  # ----------------------------------------------------------------------------
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: nawari-grafana:11.6.0-zabbix-6.10.2
    container_name: nawari-grafana
    restart: unless-stopped
    depends_on:
      zabbix-web:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
      - ZBX_API_USER=${ZBX_API_USER:-Admin}
      - ZBX_API_PASSWORD=${ZBX_API_PASSWORD:?ZBX_API_PASSWORD must be set in .env}
      - ZBX_API_TOKEN=${ZBX_API_TOKEN:-}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/plugins:/etc/grafana/provisioning/plugins:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - nawari-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 6. Asterisk 22 - Controlled Synthetic Voice Testing Engine
  # (Gated by 'synthetic-voice' profile)
  # ----------------------------------------------------------------------------
  asterisk:
    profiles:
      - synthetic-voice
    image: avtest-asterisk:22.11.0
    container_name: nawari-asterisk
    restart: unless-stopped
    user: root
    environment:
      - ASTERISK_AMI_SECRET=${ASTERISK_AMI_SECRET:-nawari_ami_dev_secret}
    entrypoint: /entrypoint.sh
    volumes:
      - ./asterisk/config:/etc/asterisk
      - ./asterisk/entrypoint.sh:/entrypoint.sh:ro
    networks:
      - nawari-internal
    healthcheck:
      test: ["CMD-SHELL", "/usr/sbin/asterisk -rx 'core show sysinfo' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
