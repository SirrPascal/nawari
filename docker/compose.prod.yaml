# ==============================================================================
# NAWARI — Production Docker Compose Overrides (Phase 8 Production Hardening)
# Target: Ubuntu Server 24.04.4 LTS (mon-grafana01 @ 10.2.1.58)
# Resource Quotas: 2 vCPU, 7.8 GiB RAM, ~17 GB Root Disk
# Hardware Budget Allocation: ~2.2 GiB Max Memory across all containers
# ==============================================================================

services:
  postgres:
    image: postgres:17.2-alpine3.21
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 256M

  zabbix-snmptraps:
    image: zabbix/zabbix-snmptraps:alpine-7.4.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      # Accept traps from enterprise subnets (10.2.156.0/24) on UDP 162
      - "0.0.0.0:162:1162/udp"
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.10'
        reservations:
          memory: 32M

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.4.0
    security_opt:
      - no-new-privileges:true
    ports:
      # Bound strictly to production host IP for sender/active agent ingress
      - "10.2.1.58:10051:10051"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.75'
        reservations:
          memory: 256M

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4.0
    security_opt:
      - no-new-privileges:true
    ports:
      # Bound strictly to loopback; exposed via reverse proxy or SSH tunnel
      - "127.0.0.1:8080:8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.30'
        reservations:
          memory: 128M

  grafana:
    image: grafana/grafana:11.6.0
    security_opt:
      - no-new-privileges:true
    ports:
      # Bound strictly to loopback; exposed via reverse proxy or SSH tunnel
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.50'
        reservations:
          memory: 150M

  asterisk:
    profiles:
      - synthetic-voice
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "127.0.0.1:5038:5038"
      - "10.2.1.58:5060:5060/udp"
      - "10.2.1.58:5061:5061"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.30'
        reservations:
          memory: 128M
