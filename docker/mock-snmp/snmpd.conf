# ==============================================================================
# NAWARI — Mock SNMP Agent Configuration (Net-SNMP)
# ==============================================================================

# Listen on UDP port 161 on all interfaces
agentaddress udp:161

# System MIB definitions
sysLocation "Nawari Lab HQ - Rack 01"
sysContact "noc@nawari.enterprise"
sysName "nawari-mock-core-switch-01"
sysDescr "Nawari Aviation Simulated Core Switch & Distribution Gateway (Net-SNMP 5.9)"
sysObjectID 1.3.6.1.4.1.8072.3.2.10
sysServices 72

# SNMPv2c Read-Only Community
rocommunity public default
rocommunity {$SNMP_COMMUNITY} default

# Include standard MIB views
view all included .1
rocommunity public default -V all

# Disk monitoring for root filesystem
disk / 10000
pass .1.3.6.1.4.1.2021.9.1.9.1 /usr/local/bin/snmp_disk_pass.sh

# SNMPv3 Access Control
rouser Admin authpriv -V all
rouser Admin_aes authpriv -V all
rouser nawari_snmp_v3 authpriv -V all
