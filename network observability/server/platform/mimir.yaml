target: all
multitenancy_enabled: true
server:
  http_listen_port: 9009
common:
  storage:
    backend: s3
    s3:
      endpoint: minio:9000
      access_key_id: ${MINIO_ACCESS_KEY}
      secret_access_key: ${MINIO_SECRET_KEY}
      insecure: true
      bucket_name: nawari-mimir
blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/ingester
ruler:
  rule_path: /data/ruler
ingest_storage:
  enabled: true
  kafka:
    address: kafka:9092
    topic: nawari-mimir-ingest
    auto_create_topic_enabled: true
    auto_create_topic_default_partitions: 3
distributor:
  remote_timeout: 5s
