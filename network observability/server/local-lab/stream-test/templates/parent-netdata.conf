[global]
    hostname = nawari-stream-test-parent
    update every = 1
[db]
    db = dbengine
    storage tiers = 1
    dbengine tier 0 retention time = 1h
    dbengine tier 0 retention size = 256MiB
[plugins]
    proc = no
    diskspace = no
    cgroups = no
    apps = no
    ebpf = no
    go.d = no
[web]
    bind to = *:19999=streaming^SSL=force *:20000=dashboard^SSL=optional
    ssl key = /etc/netdata/ssl/key.pem
    ssl certificate = /etc/netdata/ssl/cert.pem
[health]
    enabled = no
