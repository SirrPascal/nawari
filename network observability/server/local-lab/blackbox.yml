modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      preferred_ip_protocol: ip4
      valid_status_codes: [200]
  tcp_connect:
    prober: tcp
    timeout: 5s
  dns_lookup:
    prober: dns
    timeout: 5s
    dns:
      query_name: localhost
      query_type: A
      preferred_ip_protocol: ip4
