multitenancy_enabled: false
target: all

server:
  http_listen_port: 9009

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/common

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
  bucket_store:
    sync_dir: /data/tsdb-sync

compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore: {store: inmemory}

distributor:
  ring:
    kvstore: {store: inmemory}

ingester:
  ring:
    replication_factor: 1
    kvstore: {store: inmemory}

store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore: {store: inmemory}

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/rules

limits:
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  max_global_series_per_user: 200000
  compactor_blocks_retention_period: 168h
